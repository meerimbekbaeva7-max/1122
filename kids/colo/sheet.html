<script type="module">

 const h=v.x>=1060?560:880,y0=v.x>=1060?330:60;const cam=new THREE.PerspectiveCamera(30,v.w/h,.1,100);cam.position.set(.4,1.7,(v.x>=1060?16:15.5)/v.s);cam.lookAt(.35,1.15,0);
 r.setViewport(v.x,1080-y0-h,v.w,h);r.setScissor(v.x,1080-y0-h,v.w,h);r.render(sc,cam);}
