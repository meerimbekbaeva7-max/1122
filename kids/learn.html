  layoutRow(list).forEach((p,k)=>{const a=.5+k*.15,pp=back(prog(t,a,a+.5))*(1-eo(prog(t,intro-.4,intro)));place.set(p.idx,{...p,s:p.s*.8*pp,sing:true});});}
 else if(mode==='solo'){const p=back(prog(t,line.t0,line.t0+.45))*(li===L.length-1?1:1-eo(prog(t,line.t1-.3,line.t1)));place.set(sh.item,{idx:sh.item,x:0,y:0,z:0,s:1.3*p,sing:true});focus=sh.item;}
 else if(mode==='perWord'){const vis=[...(sh.keep||[]),...sh.items.filter(i=>i>=0)];const pos=layoutRow(vis);
  pos.forEach(p=>{const k=sh.items.indexOf(p.idx);let pp=1;if(k>=0){const w=line.words[k];pp=w?back(prog(t,w.t0,w.t0+.35)):1;}

 if(mode==='intro'){cx=Math.sin(t*.5)*1.2;cy=2.2;cz=15;}
 const dr=(t-(line?line.t0:0))%(4*B);cam.position.set(cx+dr*.15,cy,cz-dr*.25);cam.lookAt(lx,ly,0);
 if(mode==='blast'&&t>line.words[3].t0){const k=1-prog(t,line.words[3].t0,line.words[3].t0+1);cam.position.x+=Math.sin(t*70)*.12*k;cam.position.y+=Math.cos(t*60)*.12*k;}
 renderer.render(scene,cam);

 // ---- overlays ----
 titleSpans.forEach((sp,i)=>{const a=.15+i*.06;const p=back(prog(t,a,a+.4));const out=1-eo(prog(t,intro-.45,intro-.05));
  sp.style.transform=`translateY(${lerp(-260,0,clamp(p,0,1.2))+Math.sin(t*6+i)*8}px) scale(${Math.max(.001,p)})`;sp.style.opacity=out;});
 const w=$('word'),ly2=$('lyr');
 if(li!==lastLine){lastLine=li;ly2.innerHTML=line?line.words.map(x=>`<span>${x.w}</span>`).join(''):'';w.dataset.v='';}
 let txt='',col=null;
 if(sh){if(sh.words){const k=Math.max(0,wi);const cand=sh.words[k];txt=cand||'';if(sh.items[k]>=0)col=colOf(sh.items[k]);
   if(!cand){for(let j=Math.min(wi,sh.words.length-1);j>=0;j--)if(sh.words[j]){txt=sh.words[j];col=sh.items[j]>=0?colOf(sh.items[j]):null;break;}}}
  else if(sh.hl&&wi>=0){txt=(line.words[wi].w.replace(/[,!?.]/g,'')).toUpperCase()+'!';col=colOf(sh.items[wi]);}
  else if(mode==='blast'){txt=wi>=0?['3','2','1','BLAST','OFF!'][wi]||'':'';if(wi>=3)txt='BLAST OFF!';col=wi>=3?null:'#ffc400';}
  else{txt=sh.text||'';if(mode==='solo')col=colOf(sh.item);}}
 let wt0=line?line.t0:0;if(sh&&(sh.words||sh.hl||mode==='blast')&&wi>=0)wt0=line.words[wi].t0;
 if(w.dataset.v!==txt){w.dataset.v=txt;w.dataset.t0=String(wt0);
  w.innerHTML=col?`<span style="color:${col}">${txt}</span>`:[...txt].map((ch,i)=>ch===' '?' ':`<span style="color:${TC[i%7]}">${ch}</span>`).join('');}
 if(line&&txt){const p=back(prog(t,+w.dataset.t0,+w.dataset.t0+.3));const out=li===L.length-1?1:1-eo(prog(t,line.t1-.2,line.t1));
  w.style.opacity=out;w.style.transform=`scale(${Math.max(.001,p*(1+.04*bounce(t)))}) rotate(${Math.sin(t*3)*2}deg)`;}else w.style.opacity=0;
 if(line){const out=li===L.length-1?1:1-eo(prog(t,line.t1-.2,line.t1));ly2.style.opacity=out;
  [...ly2.children].forEach((sp,k)=>{const on=k===wi,done=k<wi;let c=TC[(k+li)%7];
   if(sh&&sh.items&&sh.items[k]>=0&&(sh.words||sh.hl))c=colOf(sh.items[k]);else if(mode==='solo')c=colOf(sh.item);
   sp.style.color=on||done?c:'#3b3b55';sp.style.transform=on?'scale(1.14) translateY(-4px)':'none';});}
 else ly2.style.opacity=0;
 // white flash on every chorus entry
 const chStart=line&&tag.startsWith('ch')?line.t0:-9;$('flash').style.opacity=Math.max(0,.5*(1-prog(t,chStart,chStart+.3)))*(t>=chStart?1:0);
};
build().then(()=>{window.sceneReady=true;});
</script></body></html>
