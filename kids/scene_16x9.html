<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:Fredoka;src:url(node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:Fredoka;src:url(node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2) format("woff2");font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#5fd0ff;font-family:Fredoka,sans-serif}
#gl{position:absolute;inset:0}
.word{position:absolute;left:0;right:0;top:40px;text-align:center;font-weight:700;font-size:190px;letter-spacing:4px;
  -webkit-text-stroke:16px #fff;paint-order:stroke fill;filter:drop-shadow(0 12px 0 rgba(0,0,0,.18));line-height:1}
.title{position:absolute;left:0;right:0;top:110px;text-align:center;font-weight:700;font-size:170px;-webkit-text-stroke:14px #fff;paint-order:stroke fill;filter:drop-shadow(0 12px 0 rgba(0,0,0,.18))}
.title span{display:inline-block}
.lyr{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:60px;padding:18px 54px 24px;
  font-weight:700;font-size:76px;color:#3b3b55;white-space:nowrap;box-shadow:0 14px 0 rgba(0,0,0,.12)}
.lyr span{display:inline-block;margin:0 20px;transform-origin:center bottom}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style></head><body>
<canvas id="gl" width="1920" height="1080"></canvas>
<div class="title" id="title"></div>
<div class="word" id="word"></div>
<div class="lyr" id="lyr"></div>
<div class="flash" id="flash"></div>
<script src="build/data.js"></script>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const S=window.SONG, ENV=window.ENV, B=S.beat, FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),prog=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),back=x=>{const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x,rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const COL={red:'#ff3b3b',blue:'#2f8bff',yellow:'#ffc400',green:'#2fd65a'};

const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(1920,1080,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(38,1920/1080,.1,200);cam.position.set(0,2.2,15);cam.lookAt(0,1.3,0);

// sky gradient
{const c=document.createElement('canvas');c.width=2;c.height=512;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,'#3ec4ff');gr.addColorStop(.7,'#9be7ff');gr.addColorStop(1,'#d8f6ff');g.fillStyle=gr;g.fillRect(0,0,2,512);
 const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;scene.background=tx;}
// sunburst behind the stage
const burstTex=(()=>{const c=document.createElement('canvas');c.width=c.height=1024;const g=c.getContext('2d');g.translate(512,512);
 for(let i=0;i<24;i++){g.fillStyle=i%2?'rgba(255,255,255,.55)':'rgba(255,255,255,0)';g.beginPath();g.moveTo(0,0);g.arc(0,0,512,i/24*Math.PI*2,(i+1)/24*Math.PI*2);g.fill();}
 const rg=g.createRadialGradient(0,0,0,0,0,512);rg.addColorStop(0,'rgba(255,255,255,0)');rg.addColorStop(.85,'rgba(255,255,255,0)');rg.addColorStop(1,'rgba(255,255,255,1)');
 g.globalCompositeOperation='destination-out';g.fillStyle=rg;g.fillRect(-512,-512,1024,1024);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;})();
const burst=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshBasicMaterial({map:burstTex,transparent:true,color:'#ffffff',depthWrite:false}));
burst.position.set(0,2,-12);scene.add(burst);

scene.add(new THREE.HemisphereLight('#ffffff','#7ad36b',1.6));
const sun=new THREE.DirectionalLight('#ffffff',2.2);sun.position.set(4,8,10);scene.add(sun);
scene.add(new THREE.AmbientLight('#ffffff',.35));

// ground hill + flowers
const hill=new THREE.Mesh(new THREE.SphereGeometry(60,96,48),new THREE.MeshStandardMaterial({color:'#5fdc4f',roughness:.85}));
hill.position.set(0,-60.4,0);scene.add(hill);
const hill2=new THREE.Mesh(new THREE.SphereGeometry(40,64,32),new THREE.MeshStandardMaterial({color:'#8ff07a',roughness:.9}));
hill2.position.set(-22,-36,-25);scene.add(hill2);
const hill3=hill2.clone();hill3.position.set(24,-35,-28);scene.add(hill3);
const flowers=[];
const petalCols=['#ff5fa2','#ffd23f','#ffffff','#ff7b3a','#b07bff'];
for(let i=0;i<34;i++){const f=new THREE.Group();const x=(rnd(i)-.5)*26,z=1+rnd(i+9)*4.5;
 const stem=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.5),new THREE.MeshStandardMaterial({color:'#2f9e44'}));stem.position.y=.25;f.add(stem);
 const pm=new THREE.MeshStandardMaterial({color:petalCols[i%5],roughness:.5});
 for(let k=0;k<5;k++){const p=new THREE.Mesh(new THREE.SphereGeometry(.12,12,8),pm);const a=k/5*Math.PI*2;p.position.set(Math.cos(a)*.14,.55+Math.sin(a)*.14,0);p.scale.z=.4;f.add(p);}
 const ctr=new THREE.Mesh(new THREE.SphereGeometry(.09,12,8),new THREE.MeshStandardMaterial({color:'#ffcc00'}));ctr.position.y=.55;f.add(ctr);
 let zz=z;if(Math.abs(x)<7.8&&zz<3.6)zz=3.6+rnd(i+21)*1.8;f.position.set(x,-.45+(-x*x/120)-(zz-3)*.05,zz);scene.add(f);flowers.push(f);}
// clouds
const clouds=[];const cm=new THREE.MeshStandardMaterial({color:'#ffffff',roughness:1});
for(let i=0;i<5;i++){const c=new THREE.Group();for(let k=0;k<5;k++){const s=new THREE.Mesh(new THREE.SphereGeometry(.8+rnd(i*5+k)*.5,20,14),cm);s.position.set((k-2)*.8,Math.sin(k)*.25,0);c.add(s);}
 c.position.set(-16+i*8,6.5+rnd(i)*2,-8-rnd(i+3)*4);c.scale.setScalar(.8+rnd(i+1)*.5);scene.add(c);clouds.push(c);}

// ---------- characters ----------
const std=(c,r=.32)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:0});
function face(parent,{y=0,z=1.1,s=1,x=0,eyes=true}){
 const f=new THREE.Group();f.position.set(x,y,z);parent.add(f);
 const eyeGroups=[];
 if(eyes){for(const sx of[-1,1]){const e=new THREE.Group();e.position.set(sx*.38*s,.22*s,0);
   const w=new THREE.Mesh(new THREE.SphereGeometry(.27*s,24,16),std('#ffffff',.2));w.scale.z=.6;e.add(w);
   const p=new THREE.Mesh(new THREE.SphereGeometry(.15*s,20,14),std('#1b1b2f',.2));p.position.z=.13*s;p.scale.z=.6;e.add(p);
   const h=new THREE.Mesh(new THREE.SphereGeometry(.05*s,10,8),std('#ffffff',.1));h.position.set(.05*s,.06*s,.22*s);e.add(h);
   f.add(e);eyeGroups.push(e);}}
 for(const sx of[-1,1]){const ch=new THREE.Mesh(new THREE.SphereGeometry(.14*s,16,10),std('#ff8fb1',.6));ch.position.set(sx*.62*s,-.12*s,-.05);ch.scale.z=.3;f.add(ch);}
 const mouth=new THREE.Group();mouth.position.set(0,-.28*s,.02);
 const m=new THREE.Mesh(new THREE.SphereGeometry(.24*s,24,16),std('#5a0f1f',.4));m.scale.set(1.25,1,.35);mouth.add(m);
 const tg=new THREE.Mesh(new THREE.SphereGeometry(.13*s,16,10),std('#ff6b8a',.5));tg.position.set(0,-.1*s,.05);tg.scale.set(1.2,.6,.4);mouth.add(tg);
 f.add(mouth);
 return{f,mouth,eyeGroups};
}
function shadow(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(0,60,0,.45)');r.addColorStop(1,'rgba(0,60,0,0)');g.fillStyle=r;g.fillRect(0,0,128,128);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(3,1.2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;return m;}

function makeApple(){const g=new THREE.Group(),b=new THREE.Group();g.add(b);
 const body=new THREE.Mesh(new THREE.SphereGeometry(1.2,48,32),std('#ff2a2a',.28));body.scale.set(1.05,.95,1);b.add(body);
 const stem=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,.55),std('#7a4a21',.7));stem.position.set(0,1.25,0);stem.rotation.z=.2;b.add(stem);
 const leaf=new THREE.Mesh(new THREE.SphereGeometry(.35,20,12),std('#38d64a',.4));leaf.scale.set(1,.35,.55);leaf.position.set(.38,1.35,0);leaf.rotation.z=-.5;b.add(leaf);
 const fc=face(b,{z:1.05});return{g,b,...fc,name:'red'};}
function makeWhale(){const g=new THREE.Group(),b=new THREE.Group();g.add(b);
 const body=new THREE.Mesh(new THREE.SphereGeometry(1.2,48,32),std('#2f8bff',.28));body.scale.set(1.45,1,1);b.add(body);
 const belly=new THREE.Mesh(new THREE.SphereGeometry(1.0,32,20),std('#bfe3ff',.4));belly.scale.set(1.2,.5,.9);belly.position.set(.1,-.62,.25);b.add(belly);
 const tail=new THREE.Group();tail.position.set(-1.75,.35,0);
 for(const s of[-1,1]){const fl=new THREE.Mesh(new THREE.SphereGeometry(.45,20,12),std('#2f8bff',.3));fl.scale.set(.9,.3,.5);fl.position.set(-.25,.25,s*.3);fl.rotation.x=s*.5;fl.rotation.z=.9;tail.add(fl);}
 b.add(tail);
 const spout=[];for(let i=0;i<6;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(.13,12,8),std('#8fdcff',.1));b.add(d);spout.push(d);}
 const fc=face(b,{z:1.08,x:.35});return{g,b,...fc,tail,spout,name:'blue'};}
function makeSun(){const g=new THREE.Group(),b=new THREE.Group();g.add(b);
 const body=new THREE.Mesh(new THREE.SphereGeometry(1.1,48,32),new THREE.MeshStandardMaterial({color:'#ffc400',roughness:.3,emissive:'#ff9d00',emissiveIntensity:.35}));b.add(body);
 const rays=new THREE.Group();for(let i=0;i<12;i++){const r=new THREE.Mesh(new THREE.ConeGeometry(.22,.6,16),new THREE.MeshStandardMaterial({color:'#ffdd33',emissive:'#ffaa00',emissiveIntensity:.4,roughness:.3}));
  const a=i/12*Math.PI*2;r.position.set(Math.cos(a)*1.45,Math.sin(a)*1.45,-.2);r.rotation.z=a-Math.PI/2;rays.add(r);}b.add(rays);
 const fc=face(b,{z:1.0});return{g,b,...fc,rays,name:'yellow'};}
function makeFrog(){const g=new THREE.Group(),b=new THREE.Group();g.add(b);
 const body=new THREE.Mesh(new THREE.SphereGeometry(1.2,48,32),std('#2fd65a',.3));body.scale.set(1.3,.85,1);b.add(body);
 const belly=new THREE.Mesh(new THREE.SphereGeometry(.9,32,20),std('#c8f7a6',.45));belly.scale.set(1.1,.65,.7);belly.position.set(0,-.35,.45);b.add(belly);
 const eyes=[];for(const s of[-1,1]){const bump=new THREE.Mesh(new THREE.SphereGeometry(.45,24,16),std('#2fd65a',.3));bump.position.set(s*.6,.85,.25);b.add(bump);}
 for(const s of[-1,1]){const leg=new THREE.Mesh(new THREE.SphereGeometry(.38,20,12),std('#27b84c',.35));leg.scale.set(1.3,.5,1);leg.position.set(s*1.1,-.75,.4);b.add(leg);}
 const fc=face(b,{z:1.0,y:.0,eyes:false});
 // eyes on the bumps
 const eg=[];for(const s of[-1,1]){const e=new THREE.Group();e.position.set(s*.6,.9,.6);
   const w=new THREE.Mesh(new THREE.SphereGeometry(.28,24,16),std('#ffffff',.2));w.scale.z=.6;e.add(w);
   const p=new THREE.Mesh(new THREE.SphereGeometry(.15,20,14),std('#1b1b2f',.2));p.position.z=.13;p.scale.z=.6;e.add(p);
   const h=new THREE.Mesh(new THREE.SphereGeometry(.05,10,8),std('#ffffff',.1));h.position.set(.05,.06,.22);e.add(h);b.add(e);eg.push(e);}
 fc.mouth.scale.x=1.6;
 return{g,b,...fc,eyeGroups:eg,name:'green'};}

const chars=[makeApple(),makeWhale(),makeSun(),makeFrog()];
chars.forEach(c=>{c.sh=shadow();scene.add(c.sh);scene.add(c.g);});

// confetti
const CN=260;const conf=new THREE.InstancedMesh(new THREE.PlaneGeometry(.16,.26),new THREE.MeshBasicMaterial({side:THREE.DoubleSide}),CN);
const cc=['#ff3b3b','#2f8bff','#ffc400','#2fd65a','#ff5fa2','#b07bff'];
for(let i=0;i<CN;i++)conf.setColorAt(i,new THREE.Color(cc[i%6]));scene.add(conf);
const dummy=new THREE.Object3D();

// ---------- timeline helpers ----------
const L=S.lines;const intro=S.intro;
const lineAt=t=>L.findIndex(l=>t>=l.t0&&t<l.t1);
const envAt=t=>ENV[Math.min(ENV.length-1,Math.max(0,Math.floor(t*FPS)))]||0;
const bounce=t=>Math.abs(Math.sin(Math.PI*t/B));   // one hop per beat
function wordAt(li,t){if(li<0)return -1;return L[li].words.findIndex(w=>t>=w.t0&&t<w.t1);}

const $=id=>document.getElementById(id);
const TITLE='Colors Song!';const TC=['#ff3b3b','#ff8a00','#ffc400','#2fd65a','#2f8bff','#7b5bff','#ff5fa2'];
$('title').innerHTML=[...TITLE].map((ch,i)=>`<span style="color:${ch===' '?'transparent':TC[i%TC.length]}">${ch===' '?'&nbsp;':ch}</span>`).join('');
const titleSpans=[...$('title').children];
let lastLine=-2;

window.renderAt=function(t){
 const li=lineAt(t);const tag=li>=0?L[li].tag:'intro';
 const col=li>=0&&li<4?COL[chars[li].name]:'#ffffff';
 burst.rotation.z=-t*.25;burst.material.color.set(li>=0&&li<4?new THREE.Color(col).lerp(new THREE.Color('#ffffff'),.55):new THREE.Color('#ffffff'));burst.material.opacity=.75;
 clouds.forEach((c,i)=>{c.position.x=((-16+i*8+t*.6)+22)%44-22;});
 flowers.forEach((f,i)=>{f.rotation.z=Math.sin(t*3+i)*.12;});

 // character placement
 const solo=li>=0&&li<4, group=tag==='chorus'||tag==='all', introT=t<intro, end=t>S.duration-1.6;
 chars.forEach((c,i)=>{
  let x=0,y=0,s=0,rotY=0,sing=false;
  if(introT){ // peek in one by one, wave
    const a=.5+i*.35;const p=back(prog(t,a,a+.5))*(1-eo(prog(t,intro-.4,intro)));
    x=(i-1.5)*3.4;y=-.2+bounce(t+i*.2)*.35;s=p*.75;rotY=Math.sin(t*3+i)*.25;
  }else if(solo){
    if(i===li){const p=back(prog(t,L[li].t0,L[li].t0+.45))*(1-eo(prog(t,L[li].t1-.3,L[li].t1)));
      x=0;y=bounce(t)*.45;s=p*1.25;rotY=Math.sin(t*2.2)*.3;sing=true;}
  }else if(group){
    const p=tag==='chorus'?back(prog(t,L[4].t0+i*.08,L[4].t0+.45+i*.08)):1;
    x=(i-1.5)*3.5;y=bounce(t+(i%2)*B)*.5;s=p*.9;rotY=Math.sin(t*3+i*1.3)*.35;sing=true;
    if(tag==='all'){const wi=wordAt(li,t);if(wi===i){s*=1.25;y+=.25;}}
  }
  if(end){const k=prog(t,S.duration-1.6,S.duration-1.1);y+=Math.sin(Math.PI*k)*1.6;}
  c.g.position.set(x,y+(c.name==='green'?.05:.35),0);c.g.scale.setScalar(Math.max(s,0.0001));c.g.visible=s>.01;c.g.rotation.y=rotY;
  // squash & stretch on landing
  const h=bounce(t+(group?(i%2)*B:0));const sq=1+(.12*(1-h)*(1-h)-.04);c.b.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));
  // mouth sync + blink
  const e=sing?envAt(t):(introT?.15+.15*Math.sin(t*8+i):0);
  c.mouth.scale.y=.25+e*1.1;
  const bl=((t+i*1.7)%3.1)<.12?.1:1;c.eyeGroups.forEach(eg=>eg.scale.y=bl);
  if(c.rays)c.rays.rotation.z=t*.8;
  if(c.tail)c.tail.rotation.y=Math.sin(t*5)*.4;
  if(c.spout)c.spout.forEach((d,k)=>{const p=((t*1.2+k/6)%1);d.position.set(.2+Math.sin(k*2)*p*.5,1.1+p*1.6,0);d.scale.setScalar((1-p)*1.2+.2);d.visible=s>.01;});
  c.sh.position.set(x,-.38,.2);c.sh.scale.setScalar(Math.max(.0001,s*(1-.35*Math.min(1,y/1.2))));c.sh.visible=s>.01;
 });

 // confetti during chorus + ending
 const confOn=group||end;
 for(let i=0;i<CN;i++){
  const st=(L[4].t0)+rnd(i)*.5;const age=t-st;const fall=(age*(1.2+rnd(i+3)*1.2)+rnd(i+7)*12)%12;
  dummy.position.set((rnd(i+11)-.5)*20,9-fall,(rnd(i+13)-.5)*6);
  dummy.rotation.set(t*3*rnd(i+1),t*4*rnd(i+2),t*2);dummy.scale.setScalar(confOn&&age>0?1:0.0001);
  dummy.updateMatrix();conf.setMatrixAt(i,dummy.matrix);}
 conf.instanceMatrix.needsUpdate=true;

 // camera: gentle sway, push-in on solos
 cam.position.x=Math.sin(t*.5)*.6;cam.position.z=solo?lerp(15,12.5,eo(prog(t,L[li].t0,L[li].t0+1))):15;
 cam.lookAt(0,1.3,0);
 renderer.render(scene,cam);

 // ---- HTML overlays ----
 // title during intro
 titleSpans.forEach((sp,i)=>{const a=.15+i*.07;const p=back(prog(t,a,a+.4));const out=1-eo(prog(t,intro-.45,intro-.05));
   sp.style.transform=`translateY(${lerp(-260,0,clamp(p,0,1.2))+Math.sin(t*6+i)*8}px) scale(${Math.max(.001,p)})`;sp.style.opacity=out;});
 // big word per line
 const w=$('word');
 if(li!==lastLine){lastLine=li;
  if(li>=0&&li<4){const nm=chars[li].name;w.textContent=nm.toUpperCase()+'!';w.style.color=COL[nm];}
  else if(tag==='chorus'){w.innerHTML=['C','O','L','O','R','S','!'].map((ch,i)=>`<span style="color:${TC[i]}">${ch}</span>`).join('');}
  else if(tag==='all'){w.innerHTML=['RED','BLUE','YELLOW','GREEN'].map(n=>`<span style="color:${COL[n.toLowerCase()]};font-size:130px">${n}</span>`).join(' ');}
  else w.textContent='';
  const ly=$('lyr');ly.innerHTML=li>=0?L[li].words.map(x=>`<span>${x.w}</span>`).join(''):'';ly.style.opacity=li>=0?1:0;}
 if(li>=0){const p=back(prog(t,L[li].t0,L[li].t0+.4));const out=1-eo(prog(t,L[li].t1-.25,L[li].t1));
  w.style.transform=`scale(${Math.max(.001,p*(1+.04*bounce(t)))}) rotate(${Math.sin(t*3)*2}deg)`;w.style.opacity=li===L.length-1?1:out;
  const wi=wordAt(li,t);const ly=$('lyr');ly.style.opacity=li===L.length-1?1:out;
  [...ly.children].forEach((sp,k)=>{const on=k===wi;const done=k<wi;
    const c=li<4?COL[chars[li].name]:(tag==='all'?Object.values(COL)[Math.min(k,3)]:TC[k%TC.length]);
    sp.style.color=on||done?c:'#3b3b55';sp.style.transform=on?'scale(1.14) translateY(-4px)':'none';});}
 else{w.style.opacity=0;}
 // white flash on chorus entry
 $('flash').style.opacity=t>L[4].t0?Math.max(0,.6*(1-prog(t,L[4].t0,L[4].t0+.35))):0;
};
window.sceneReady=true;
</script></body></html>
