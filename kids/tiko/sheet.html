r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.1;r.setScissorTest(true);

for(const v of views){const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight('#ffffff','#a8f0c8',1.5));const dl=new THREE.DirectionalLight('#fff',2.0);dl.position.set(4,8,10);sc.add(dl);sc.add(new THREE.AmbientLight('#fff',.45));

 if(v.surprise){L.eyes.forEach(e=>e.scale.set(1.15,1.25,1));L.mouth.scale.set(.7,1.6,1);L.arms.forEach((a,i)=>a.position.y+=.5);}
 if(v.mouth>=1)L.arms.forEach((a,i)=>{a.position.y+=.6;});
 sc.add(L.g);const sh=new THREE.Mesh(new THREE.CircleGeometry(1.5,40),new THREE.MeshBasicMaterial({color:'#2a4a7a',transparent:true,opacity:.12}));sh.rotation.x=-Math.PI/2;sh.scale.y=.5;sh.position.y=-.35;sc.add(sh);
 if(v.drops){L.mouth.scale.set(1.2,2.2,1);}
 const cam=new THREE.PerspectiveCamera(30,v.w/v.h,.1,100);cam.position.set(0,1.9,v.d+.5);cam.lookAt(0,1.5,0);
 r.setViewport(v.x,1080-v.y-v.h,v.w,v.h);r.setScissor(v.x,1080-v.y-v.h,v.w,v.h);r.render(sc,cam);}
