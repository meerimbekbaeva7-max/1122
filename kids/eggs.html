<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:Fredoka;src:url(node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2) format("woff2");font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#5fd0ff;font-family:Fredoka,sans-serif}
#gl{position:absolute;inset:0}
.word{position:absolute;left:20px;right:20px;top:190px;text-align:center;font-weight:700;font-size:200px;line-height:1;-webkit-text-stroke:16px #fff;paint-order:stroke fill;filter:drop-shadow(0 12px 0 rgba(0,0,0,.18))}
.lyr{position:absolute;left:50%;bottom:400px;transform:translateX(-50%);background:rgba(255,255,255,.93);border-radius:56px;padding:20px 40px 26px;width:max-content;max-width:980px;text-align:center;
 font-weight:700;font-size:66px;color:#3b3b55;box-shadow:0 14px 0 rgba(0,0,0,.12)}
.lyr span{display:inline-block;margin:0 14px;transform-origin:center bottom}
.flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body>
<canvas id="gl" width="1080" height="1920"></canvas>
<div class="word" id="word"></div><div class="lyr" id="lyr"></div><div class="flash" id="flash"></div>
<script src="build_eggs/data.js"></script>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const S=window.SONG,ENV=window.ENV,B=S.beat,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),prog=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),back=x=>{const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x,rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const TC=['#ff3b3b','#ff8a00','#ffc400','#2fd65a','#2f8bff','#7b5bff','#ff5fa2'];
const COL=['#ff3b3b','#2f8bff','#ffc400','#2fd65a'],NAMES=['RED!','BLUE!','YELLOW!','GREEN!'];
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(1080,1920,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(50,1080/1920,.1,200);
{const c=document.createElement('canvas');c.width=2;c.height=512;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,'#ff9ad5');gr.addColorStop(.55,'#b9a6ff');gr.addColorStop(1,'#8fe3ff');g.fillStyle=gr;g.fillRect(0,0,2,512);
 const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;scene.background=tx;}
const burstTex=(()=>{const c=document.createElement('canvas');c.width=c.height=1024;const g=c.getContext('2d');g.translate(512,512);
 for(let i=0;i<24;i++){g.fillStyle=i%2?'rgba(255,255,255,.55)':'rgba(255,255,255,0)';g.beginPath();g.moveTo(0,0);g.arc(0,0,512,i/24*Math.PI*2,(i+1)/24*Math.PI*2);g.fill();}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;})();
const burst=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshBasicMaterial({map:burstTex,transparent:true,depthWrite:false,opacity:.7}));burst.position.set(0,2,-12);scene.add(burst);
scene.add(new THREE.HemisphereLight('#ffffff','#b9a6ff',1.6));const sun=new THREE.DirectionalLight('#ffffff',2.3);sun.position.set(4,8,10);scene.add(sun);scene.add(new THREE.AmbientLight('#ffffff',.35));
// stage: soft round podium
const stage=new THREE.Mesh(new THREE.CylinderGeometry(9,9.5,.6,64),new THREE.MeshStandardMaterial({color:'#ffffff',roughness:.6}));stage.position.y=-.7;scene.add(stage);
const rim=new THREE.Mesh(new THREE.TorusGeometry(9.2,.18,12,96),new THREE.MeshStandardMaterial({color:'#ff5fa2',roughness:.4}));rim.rotation.x=Math.PI/2;rim.position.y=-.4;scene.add(rim);
// ---------- characters ----------
const std=(c,r=.32)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:0});
function face(parent,{y=0,z=1.1,s=1,x=0,eyes=true}){
 const f=new THREE.Group();f.position.set(x,y,z);parent.add(f);
 const eyeGroups=[];
 if(eyes){for(const sx of[-1,1]){const e=new THREE.Group();e.position.set(sx*.38*s,.22*s,0);
   const w=new THREE.Mesh(new THREE.SphereGeometry(.27*s,24,16),std('#ffffff',.2));w.scale.z=.6;e.add(w);
   const p=new THREE.Mesh(new THREE.SphereGeometry(.15*s,20,14),std('#1b1b2f',.2));p.position.z=.13*s;p.scale.z=.6;e.add(p);
   const h=new THREE.Mesh(new THREE.SphereGeometry(.05*s,10,8),std('#ffffff',.1));h.position.set(.05*s,.06*s,.22*s);e.add(h);
   f.add(e);eyeGroups.push(e);}}
 for(const sx of[-1,1]){const ch=new THREE.Mesh(new THREE.SphereGeometry(.14*s,16,10),std('#ff8fb1',.6));ch.position.set(sx*.62*s,-.12*s,-.05);ch.scale.z=.3;f.add(ch);}
 const mouth=new THREE.Group();mouth.position.set(0,-.28*s,.02);
 const m=new THREE.Mesh(new THREE.SphereGeometry(.24*s,24,16),std('#5a0f1f',.4));m.scale.set(1.25,1,.35);mouth.add(m);
 const tg=new THREE.Mesh(new THREE.SphereGeometry(.13*s,16,10),std('#ff6b8a',.5));tg.position.set(0,-.1*s,.05);tg.scale.set(1.2,.6,.4);mouth.add(tg);
 f.add(mouth);
 return{f,mouth,eyeGroups};
}
function shadow(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(0,60,0,.45)');r.addColorStop(1,'rgba(0,60,0,0)');g.fillStyle=r;g.fillRect(0,0,128,128);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(3,1.2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;return m;}

function makeApple(){const g=new THREE.Group(),b=new THREE.Group();g.add(b);
 const body=new THREE.Mesh(new THREE.SphereGeometry(1.2,48,32),std('#ff2a2a',.28));body.scale.set(1.05,.95,1);b.add(body);
 const stem=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,.55),std('#7a4a21',.7));stem.position.set(0,1.25,0);stem.rotation.z=.2;b.add(stem);
 const leaf=new THREE.Mesh(new THREE.SphereGeometry(.35,20,12),std('#38d64a',.4));leaf.scale.set(1,.35,.55);leaf.position.set(.38,1.35,0);leaf.rotation.z=-.5;b.add(leaf);
 const fc=face(b,{z:1.05});return{g,b,...fc,name:'red'};}
function makeWhale(){const g=new THREE.Group(),b=new THREE.Group();g.add(b);
 const body=new THREE.Mesh(new THREE.SphereGeometry(1.2,48,32),std('#2f8bff',.28));body.scale.set(1.45,1,1);b.add(body);
 const belly=new THREE.Mesh(new THREE.SphereGeometry(1.0,32,20),std('#bfe3ff',.4));belly.scale.set(1.2,.5,.9);belly.position.set(.1,-.62,.25);b.add(belly);
 const tail=new THREE.Group();tail.position.set(-1.75,.35,0);
 for(const s of[-1,1]){const fl=new THREE.Mesh(new THREE.SphereGeometry(.45,20,12),std('#2f8bff',.3));fl.scale.set(.9,.3,.5);fl.position.set(-.25,.25,s*.3);fl.rotation.x=s*.5;fl.rotation.z=.9;tail.add(fl);}
 b.add(tail);
 const spout=[];for(let i=0;i<6;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(.13,12,8),std('#8fdcff',.1));b.add(d);spout.push(d);}
 const fc=face(b,{z:1.08,x:.35});return{g,b,...fc,tail,spout,name:'blue'};}
function makeSun(){const g=new THREE.Group(),b=new THREE.Group();g.add(b);
 const body=new THREE.Mesh(new THREE.SphereGeometry(1.1,48,32),new THREE.MeshStandardMaterial({color:'#ffc400',roughness:.3,emissive:'#ff9d00',emissiveIntensity:.35}));b.add(body);
 const rays=new THREE.Group();for(let i=0;i<12;i++){const r=new THREE.Mesh(new THREE.ConeGeometry(.22,.6,16),new THREE.MeshStandardMaterial({color:'#ffdd33',emissive:'#ffaa00',emissiveIntensity:.4,roughness:.3}));
  const a=i/12*Math.PI*2;r.position.set(Math.cos(a)*1.45,Math.sin(a)*1.45,-.2);r.rotation.z=a-Math.PI/2;rays.add(r);}b.add(rays);
 const fc=face(b,{z:1.0});return{g,b,...fc,rays,name:'yellow'};}
function makeFrog(){const g=new THREE.Group(),b=new THREE.Group();g.add(b);
 const body=new THREE.Mesh(new THREE.SphereGeometry(1.2,48,32),std('#2fd65a',.3));body.scale.set(1.3,.85,1);b.add(body);
 const belly=new THREE.Mesh(new THREE.SphereGeometry(.9,32,20),std('#c8f7a6',.45));belly.scale.set(1.1,.65,.7);belly.position.set(0,-.35,.45);b.add(belly);
 const eyes=[];for(const s of[-1,1]){const bump=new THREE.Mesh(new THREE.SphereGeometry(.45,24,16),std('#2fd65a',.3));bump.position.set(s*.6,.85,.25);b.add(bump);}
 for(const s of[-1,1]){const leg=new THREE.Mesh(new THREE.SphereGeometry(.38,20,12),std('#27b84c',.35));leg.scale.set(1.3,.5,1);leg.position.set(s*1.1,-.75,.4);b.add(leg);}
 const fc=face(b,{z:1.0,y:.0,eyes:false});
 // eyes on the bumps
 const eg=[];for(const s of[-1,1]){const e=new THREE.Group();e.position.set(s*.6,.9,.6);
   const w=new THREE.Mesh(new THREE.SphereGeometry(.28,24,16),std('#ffffff',.2));w.scale.z=.6;e.add(w);
   const p=new THREE.Mesh(new THREE.SphereGeometry(.15,20,14),std('#1b1b2f',.2));p.position.z=.13;p.scale.z=.6;e.add(p);
   const h=new THREE.Mesh(new THREE.SphereGeometry(.05,10,8),std('#ffffff',.1));h.position.set(.05,.06,.22);e.add(h);b.add(e);eg.push(e);}
 fc.mouth.scale.x=1.6;
 return{g,b,...fc,eyeGroups:eg,name:'green'};}


const chars=[makeApple(),makeWhale(),makeSun(),makeFrog()];
chars.forEach(c=>{scene.add(c.g);c.g.visible=false;});
// eggs: lathe profile, polka dots, separate top shell that pops off
function eggGeo(t0,t1){const pts=[];for(let i=0;i<=40;i++){const t=lerp(t0,t1,i/40),y=t*3.2-1.6;const r=1.25*Math.sqrt(Math.max(0,1-Math.pow(y/1.6,2)))*(1-.18*(y/1.6));pts.push(new THREE.Vector2(Math.max(r,.001),y+1.6));}return new THREE.LatheGeometry(pts,48);}
const dotTex=c=>{const cv=document.createElement('canvas');cv.width=512;cv.height=256;const g=cv.getContext('2d');g.fillStyle=c;g.fillRect(0,0,512,256);g.fillStyle='rgba(255,255,255,.9)';
 for(let i=0;i<26;i++){g.beginPath();g.arc(rnd(i)*512,rnd(i+5)*256,10+rnd(i+2)*14,0,7);g.fill();}const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;};
const eggs=COL.map((c,i)=>{const g=new THREE.Group();const m=new THREE.MeshStandardMaterial({map:dotTex(c),roughness:.25,side:THREE.DoubleSide});
 const bot=new THREE.Mesh(eggGeo(0,.58),m);const top=new THREE.Mesh(eggGeo(.58,1),m);g.add(bot);g.add(top);
 const crack=new THREE.Mesh(new THREE.TorusGeometry(1.08,.05,6,48),new THREE.MeshBasicMaterial({color:'#3b3b55'}));crack.rotation.x=Math.PI/2;crack.position.y=1.86;crack.visible=false;g.add(crack);
 scene.add(g);return{g,top,bot,crack};});
// sparkle burst on each reveal
const SN=60;const spark=new THREE.InstancedMesh(new THREE.OctahedronGeometry(.12),new THREE.MeshBasicMaterial({color:'#ffffff'}),SN);scene.add(spark);
for(let i=0;i<SN;i++)spark.setColorAt(i,new THREE.Color(['#ffffff','#fff3a0','#ffd1f0'][i%3]));
const CN=200;const conf=new THREE.InstancedMesh(new THREE.PlaneGeometry(.18,.3),new THREE.MeshBasicMaterial({side:THREE.DoubleSide}),CN);
for(let i=0;i<CN;i++)conf.setColorAt(i,new THREE.Color(TC[i%7]));scene.add(conf);const dm=new THREE.Object3D();

const L=S.lines;const envAt=t=>ENV[Math.min(ENV.length-1,Math.max(0,Math.floor(t*FPS)))]||0;
const bounce=t=>Math.abs(Math.sin(Math.PI*t/B));const wordAt=(li,t)=>L[li].words.findIndex(w=>t>=w.t0&&t<w.t1);
const reveal=i=>L[i+1].t0+1.5;   // pop moment for egg i (lines 1..4)
const ROW=[-3.3,-1.1,1.1,3.3];
const $=id=>document.getElementById(id);let last=-1;
window.renderAt=function(t){
 let li=L.findIndex(l=>t>=l.t0&&t<l.t1);if(li<0)li=L.length-1;const line=L[li],wi=wordAt(li,t),e=envAt(t);
 burst.rotation.z=-t*.3;
 const focus=li>=1?li-1:-1;              // egg being opened
 const finale=t>=L[4].t0+2.6;            // last bar: everyone together
 eggs.forEach((eg,i)=>{
  const rv=reveal(i);const opened=t>=rv;
  // layout: row in the hook, the egg in focus moves to centre stage
  let x=ROW[i],z=0,s=.85;
  if(focus>=0&&!finale){if(i===focus){const k=eo(prog(t,line.t0,line.t0+.4));x=lerp(ROW[i],0,k);z=lerp(0,2,k);s=lerp(.85,1.35,k);}else{x=ROW[i]*1.25;z=-3;s=.6;}}
  if(finale){x=ROW[i];z=0;s=.85;}
  const pop=1+.08*Math.max(0,1-t*2)*Math.sin(t*20+i);
  eg.g.position.set(x,-.4+(focus<0?bounce(t+i*B/2)*.35:0),z);eg.g.scale.setScalar(s*Math.max(pop,.001));
  // shake before cracking
  const shaking=i===focus&&t>line.t0+.2&&t<rv;eg.g.rotation.z=shaking?Math.sin(t*38)*.12*(1+prog(t,line.t0,rv)):Math.sin(t*2+i)*.05;
  eg.crack.visible=i===focus&&t>line.t0+1.0&&!opened;
  // top shell flies away, bottom stays then shrinks
  const fly=prog(t,rv,rv+.6);eg.top.position.set(fly*1.5,fly*4,fly*1);eg.top.rotation.z=-fly*2.5;eg.top.visible=fly<1;
  const gone=prog(t,rv+.1,rv+.35);eg.bot.scale.setScalar(1-gone*.999);eg.g.visible=!(opened&&gone>=1)||false;
  if(opened&&gone>=1)eg.g.visible=false;
 });
 chars.forEach((c,i)=>{const rv=reveal(i);const opened=t>=rv;c.g.visible=opened;if(!opened)return;
  let x=0,z=2,s=1.2;
  if(focus>=0&&focus!==i&&!finale){x=ROW[i]*1.25;z=-3;s=.55;}
  if(finale){x=ROW[i];z=0;s=.62;}
  const p=back(prog(t,rv,rv+.45));
  const hop=Math.sin(Math.PI*prog(t,rv,rv+.6))*1.8;c.g.position.set(x,-.1+bounce(t+i*B/2)*.5+hop,z);c.g.scale.setScalar(Math.max(.001,s*p));c.g.rotation.y=Math.sin(t*2.4+i)*.3;
  const sq=1+(.12*(1-bounce(t))**2-.04);c.b.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));
  const sing=(i===focus&&!finale)||finale;c.mouth.scale.y=.25+(sing?e:0)*1.1;
  const bl=((t+i*1.7)%3.1)<.12?.1:1;c.eyeGroups.forEach(g=>g.scale.y=bl);
  if(c.rays)c.rays.rotation.z=t*.8;if(c.tail)c.tail.rotation.y=Math.sin(t*5)*.4;
  if(c.spout)c.spout.forEach((d,k)=>{const q=((t*1.2+k/6)%1);d.position.set(.2+Math.sin(k*2)*q*.5,1.1+q*1.6,0);d.scale.setScalar((1-q)*1.2+.2);});
 });
 // sparkles at the current reveal
 const rvC=focus>=0?reveal(focus):-9;const sp=prog(t,rvC,rvC+.8);
 for(let i=0;i<SN;i++){const a=rnd(i)*Math.PI*2,b=rnd(i+3)*Math.PI-1;const r=sp*(2+rnd(i+7)*3);
  dm.position.set(Math.cos(a)*Math.cos(b)*r,1.6+Math.sin(b)*r,2+Math.sin(a)*Math.cos(b)*r);dm.rotation.set(t*5,t*3,0);dm.scale.setScalar(sp>0&&sp<1?(1-sp)*1.5:.0001);dm.updateMatrix();spark.setMatrixAt(i,dm.matrix);}
 spark.instanceMatrix.needsUpdate=true;
 const confOn=finale||li===0;for(let i=0;i<CN;i++){const fall=((t)*(1.2+rnd(i+3))+rnd(i+7)*14)%14;dm.position.set((rnd(i+11)-.5)*12,11-fall,(rnd(i+13)-.5)*6);dm.rotation.set(t*3*rnd(i+1),t*4*rnd(i+2),t*2);dm.scale.setScalar(confOn?1:.0001);dm.updateMatrix();conf.setMatrixAt(i,dm.matrix);}
 conf.instanceMatrix.needsUpdate=true;
 // camera: punch-in on the egg being opened, wide for hook/finale
 const wide=focus<0||finale;cam.position.set(Math.sin(t*.7)*.5,wide?2.4:1.9,wide?16:12.5);cam.lookAt(0,wide?1.3:1.4,0);
 if(focus>=0&&!finale){const sh=t>rvC&&t<rvC+.3?(1-prog(t,rvC,rvC+.3))*.15:0;cam.position.x+=Math.sin(t*80)*sh;cam.position.y+=Math.cos(t*70)*sh;}
 renderer.render(scene,cam);
 // overlays
 const w=$('word');let html,key;
 if(finale){key='fin';html=['RED','BLUE','YELLOW','GREEN'].map((n,i)=>`<span style="color:${COL[i]};font-size:120px">${n}</span>`+(i===1?'<br>':' ')).join('');}
 else if(focus<0){key='hook';html=[...'SURPRISE!'].map((ch,i)=>`<span style="color:${TC[i%7]}">${ch}</span>`).join('')+'<br><span style="color:#fff;-webkit-text-stroke:14px #ff5fa2;font-size:150px">EGGS 🥚</span>';}
 else if(t>=rvC){key='n'+focus;html=`<span style="color:${COL[focus]}">${NAMES[focus]}</span>`;}
 else{key='q'+focus;html='<span style="color:#fff;-webkit-text-stroke:16px #7b5bff">???</span>';}
 if(w.dataset.k!==key){w.dataset.k=key;w.innerHTML=html;w.dataset.t0=String(key==='hook'?-1:(key==='fin'?L[4].t0+2.6:(key[0]==='n'?rvC:line.t0)));}
 const pw=key==='hook'?1:back(prog(t,+w.dataset.t0,+w.dataset.t0+.3));w.style.transform=`scale(${Math.max(.001,pw*(1+.04*bounce(t)))}) rotate(${Math.sin(t*3)*2}deg)`;
 const ly=$('lyr');if(li!==last){last=li;ly.innerHTML=line.words.map(x=>`<span>${x.w}</span>`).join('');}
 [...ly.children].forEach((sp,k)=>{const on=k===wi,done=k<wi;const c=focus>=0?COL[focus]:TC[k%7];sp.style.color=on||done?c:'#3b3b55';sp.style.transform=on?'scale(1.14) translateY(-4px)':'none';});
 $('flash').style.opacity=focus>=0&&t>rvC?Math.max(0,.55*(1-prog(t,rvC,rvC+.3))):0;
};
window.sceneReady=true;
</script></body></html>
