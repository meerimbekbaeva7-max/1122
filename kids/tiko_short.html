<script type="module">

const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(46,1080/1920,.1,200);
{const c=document.createElement('canvas');c.width=2;c.height=512;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,'#5fc8ff');gr.addColorStop(.6,'#bdeaff');gr.addColorStop(1,'#ffe6b0');g.fillStyle=gr;g.fillRect(0,0,2,512);const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;scene.background=tx;}
const bt=(()=>{const c=document.createElement('canvas');c.width=c.height=1024;const g=c.getContext('2d');g.translate(512,512);for(let i=0;i<24;i++){g.fillStyle=i%2?'rgba(255,255,255,.55)':'rgba(255,255,255,0)';g.beginPath();g.moveTo(0,0);g.arc(0,0,512,i/24*Math.PI*2,(i+1)/24*Math.PI*2);g.fill();}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;})();
const burst=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshBasicMaterial({map:bt,transparent:true,depthWrite:false,opacity:.7}));burst.position.set(0,3,-15);scene.add(burst);
scene.add(new THREE.HemisphereLight('#ffffff','#9be38a',1.5));const sl=new THREE.DirectionalLight('#fff',2.2);sl.position.set(4,8,10);scene.add(sl);scene.add(new THREE.AmbientLight('#fff',.4));
const hill=new THREE.Mesh(new THREE.SphereGeometry(40,96,48),new THREE.MeshStandardMaterial({color:'#5fdc4f',roughness:.85}));hill.position.set(0,-40.05,0);scene.add(hill);
for(const [x,z,rr] of[[-14,-22,16],[15,-25,18]]){const h=new THREE.Mesh(new THREE.SphereGeometry(rr,48,24),new THREE.MeshStandardMaterial({color:'#8ff07a',roughness:.9}));h.position.set(x,-rr+3,z);scene.add(h);}
const pc=['#ff5fa2','#ffd23f','#ffffff','#ff7b3a','#b07bff'];const flowers=[];
for(let i=0;i<18;i++){const f=new THREE.Group();const x=(rnd(i)-.5)*10,z=2.2+rnd(i+9)*3;const st=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.5),new THREE.MeshStandardMaterial({color:'#2f9e44'}));st.position.y=.25;f.add(st);
 for(let k=0;k<5;k++){const p=new THREE.Mesh(new THREE.SphereGeometry(.12,12,8),new THREE.MeshStandardMaterial({color:pc[i%5]}));const a=k/5*Math.PI*2;p.position.set(Math.cos(a)*.14,.55+Math.sin(a)*.14,0);p.scale.z=.4;f.add(p);}

window.renderAt=function(t){
 let li=L.findIndex(l=>t>=l.t0&&t<l.t1);if(li<0)li=L.length-1;const line=L[li],wi=wordAt(li,t),e=envAt(t),tag=line.tag;

 else if(tag==='s1'||tag==='s2'){let idx=-1;for(let i=0;i<6;i++)if(t>=lightAt[i])idx=i;if(t>=allFlash){key='rb';html=[...'RAINBOW!'].map((c,i)=>`<span style="color:${TC[i%7]}">${c}</span>`).join('');t0=allFlash;}else if(idx>=0){key='c'+idx;html=`<span style="color:${SC[idx]}">${SN[idx]}</span>`;t0=lightAt[idx];}}
