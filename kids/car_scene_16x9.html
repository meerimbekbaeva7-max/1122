<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:Fredoka;src:url(node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2) format("woff2");font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#5fd0ff;font-family:Fredoka,sans-serif}
#gl{position:absolute;inset:0}
.word{position:absolute;left:30px;right:30px;top:34px;text-align:center;font-weight:700;font-size:170px;letter-spacing:4px;
  -webkit-text-stroke:16px #fff;paint-order:stroke fill;filter:drop-shadow(0 12px 0 rgba(0,0,0,.18));line-height:1}
.title{position:absolute;left:0;right:0;top:90px;text-align:center;font-weight:700;font-size:190px;line-height:1.05;-webkit-text-stroke:14px #fff;paint-order:stroke fill;filter:drop-shadow(0 12px 0 rgba(0,0,0,.18))}
.title span{display:inline-block}
.lyr{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:56px;padding:20px 40px 26px;width:max-content;max-width:1700px;text-align:center;line-height:1.25;
  font-weight:700;font-size:64px;color:#3b3b55;text-wrap:balance;box-shadow:0 14px 0 rgba(0,0,0,.12)}
.lyr span{display:inline-block;margin:0 16px;transform-origin:center bottom}
.bubble{position:absolute;font-weight:700;font-size:120px;color:#ff3b3b;-webkit-text-stroke:12px #fff;paint-order:stroke fill;filter:drop-shadow(0 10px 0 rgba(0,0,0,.18))}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style></head><body>
<canvas id="gl" width="1920" height="1080"></canvas>
<div class="title" id="title"></div>
<div class="word" id="word"></div>
<div class="bubble" id="b1" style="left:330px;top:300px">BEEP!</div>
<div class="bubble" id="b2" style="right:330px;top:240px">BEEP!</div>
<div class="lyr" id="lyr"></div>
<div class="flash" id="flash"></div>
<script src="build_car/data.js"></script>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
const S=window.SONG,ENV=window.ENV,B=S.beat,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),prog=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,back=x=>{const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x,rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const TC=['#ff3b3b','#ff8a00','#ffc400','#2fd65a','#2f8bff','#7b5bff','#ff5fa2'];

const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(1920,1080,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(36,1920/1080,.1,300);
{const c=document.createElement('canvas');c.width=2;c.height=512;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,'#3ec4ff');gr.addColorStop(.7,'#9be7ff');gr.addColorStop(1,'#d8f6ff');g.fillStyle=gr;g.fillRect(0,0,2,512);
 const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;scene.background=tx;}
scene.add(new THREE.HemisphereLight('#ffffff','#7ad36b',1.6));
const sunL=new THREE.DirectionalLight('#ffffff',2.2);sunL.position.set(5,9,8);scene.add(sunL);
scene.add(new THREE.AmbientLight('#ffffff',.35));
const std=(c,r=.3,extra={})=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:0,...extra});

// ---------- world (scrolls along -x) ----------
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,200),std('#5fdc4f',.9));ground.rotation.x=-Math.PI/2;ground.position.y=-.01;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(400,3.4),std('#5b5f73',.8));road.rotation.x=-Math.PI/2;scene.add(road);
for(const z of[-1.75,1.75]){const k=new THREE.Mesh(new THREE.PlaneGeometry(400,.25),std('#ffffff',.6));k.rotation.x=-Math.PI/2;k.position.set(0,.005,z);scene.add(k);}
const dashes=new THREE.Group();scene.add(dashes);
for(let i=0;i<80;i++){const d=new THREE.Mesh(new THREE.PlaneGeometry(1.2,.18),std('#ffd23f',.5));d.rotation.x=-Math.PI/2;d.position.set(-80+i*2.4,.006,0);dashes.add(d);}
// background hills (static, slow parallax)
const hills=new THREE.Group();scene.add(hills);
[['#8ff07a',-30,-60,40],['#6be35a',20,-55,34],['#8ff07a',70,-62,44],['#6be35a',-80,-58,38],['#8ff07a',120,-60,40]].forEach(([c,x,z,r])=>{const h=new THREE.Mesh(new THREE.SphereGeometry(r,48,24),std(c,.95));h.position.set(x,-r*.72,z);hills.add(h);});
// trees + flowers that scroll
const deco=new THREE.Group();scene.add(deco);const SPAN=120;
for(let i=0;i<46;i++){const g=new THREE.Group();const tree=rnd(i+5)>.4;const z=tree?-(3.4+rnd(i)*9):(i%3?2.5+rnd(i)*1.8:-(2.6+rnd(i)*3));
 if(tree){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,1.2),std('#8a5a2b',.8));trunk.position.y=.6;g.add(trunk);
  const cols=['#2fbf4a','#3ad65a','#27a844'];for(let k=0;k<3;k++){const b=new THREE.Mesh(new THREE.SphereGeometry(.85-k*.15,20,14),std(cols[k],.6));b.position.set((k-1)*.35,1.6+k*.45,0);g.add(b);}
  g.scale.setScalar(.9+rnd(i+2)*.6);}
 else{const pc=['#ff5fa2','#ffd23f','#ffffff','#ff7b3a','#b07bff'][i%5];const stem=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.6),std('#2f9e44'));stem.position.y=.3;g.add(stem);
  for(let k=0;k<5;k++){const p=new THREE.Mesh(new THREE.SphereGeometry(.16,12,8),std(pc,.5));const a=k/5*Math.PI*2;p.position.set(Math.cos(a)*.18,.66+Math.sin(a)*.18,0);p.scale.z=.4;g.add(p);}
  const ctr=new THREE.Mesh(new THREE.SphereGeometry(.11,12,8),std('#ffcc00'));ctr.position.y=.66;g.add(ctr);}
 g.userData.x0=-SPAN/2+rnd(i+9)*SPAN;g.position.z=z;deco.add(g);}
const clouds=[];const cm=std('#ffffff',1);
for(let i=0;i<6;i++){const c=new THREE.Group();for(let k=0;k<5;k++){const s=new THREE.Mesh(new THREE.SphereGeometry(1.2+rnd(i*5+k)*.6,20,14),cm);s.position.set((k-2)*1.2,Math.sin(k)*.35,0);c.add(s);}
 c.userData.x0=-40+i*16;c.position.set(0,14+rnd(i)*5,-30-rnd(i+3)*10);scene.add(c);clouds.push(c);}

// ---------- the car ----------
function makeCar(color,withFace=true){
 const car=new THREE.Group(),body=new THREE.Group();car.add(body);
 const lower=new THREE.Mesh(new RoundedBoxGeometry(3.0,1.0,1.7,6,.35),std(color,.25));lower.position.y=.95;body.add(lower);
 const cabin=new THREE.Mesh(new RoundedBoxGeometry(1.75,.95,1.5,6,.35),std(color,.25));cabin.position.set(-.25,1.8,0);body.add(cabin);
 // windows
 const glass=std('#bfeaff',.1,{emissive:'#3aa0d8',emissiveIntensity:.15});
 const side=new THREE.Mesh(new RoundedBoxGeometry(1.35,.6,1.54,4,.2),glass);side.position.set(-.3,1.85,0);body.add(side);
 const wind=new THREE.Mesh(new RoundedBoxGeometry(.1,.62,1.25,3,.05),glass);wind.position.set(.62,1.85,0);body.add(wind);
 // headlights
 const hl=[];for(const z of[-.55,.55]){const l=new THREE.Mesh(new THREE.SphereGeometry(.2,20,14),std('#fff6c2',.2,{emissive:'#ffd23f',emissiveIntensity:.2}));l.position.set(1.48,1.05,z);l.scale.x=.5;body.add(l);hl.push(l);}
 // bumper
 const bump=new THREE.Mesh(new RoundedBoxGeometry(.25,.28,1.75,3,.1),std('#d9dbe6',.3));bump.position.set(1.52,.6,0);body.add(bump);
 // wheels
 const wheels=[];for(const x of[-.95,.95])for(const z of[-.82,.82]){const w=new THREE.Group();w.position.set(x,.5,z);
   const tire=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.38,32),std('#26262e',.7));tire.rotation.x=Math.PI/2;w.add(tire);
   const hub=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.4,20),std('#e8e8f0',.3));hub.rotation.x=Math.PI/2;w.add(hub);
   const sp=new THREE.Mesh(new THREE.BoxGeometry(.42,.08,.42),std('#ffc400',.4));w.add(sp);   // visible spoke so the spin reads
   body.add(w);wheels.push(w);}
 let face=null;
 if(withFace){ // eyes on the windshield, smile on the bumper
  const eyes=[];for(const z of[-.3,.3]){const e=new THREE.Group();e.position.set(.7,1.88,z);
    const w=new THREE.Mesh(new THREE.SphereGeometry(.26,24,16),std('#ffffff',.2));w.scale.x=.45;e.add(w);
    const p=new THREE.Mesh(new THREE.SphereGeometry(.14,20,14),std('#1b1b2f',.2));p.position.x=.11;p.scale.x=.45;e.add(p);
    const h=new THREE.Mesh(new THREE.SphereGeometry(.05,10,8),std('#ffffff',.1));h.position.set(.18,.06,.05);e.add(h);body.add(e);eyes.push(e);}
  const mouth=new THREE.Group();mouth.position.set(1.5,.92,0);
  const m=new THREE.Mesh(new THREE.SphereGeometry(.24,24,16),std('#5a0f1f',.4));m.scale.set(.35,1,1.6);mouth.add(m);
  const tg=new THREE.Mesh(new THREE.SphereGeometry(.12,16,10),std('#ff6b8a',.5));tg.position.set(.04,-.1,0);tg.scale.set(.4,.6,1.2);mouth.add(tg);body.add(mouth);
  for(const z of[-.72,.72]){const ch=new THREE.Mesh(new THREE.SphereGeometry(.12,16,10),std('#ff8fb1',.6));ch.position.set(1.47,1.0,z*1.0);ch.scale.x=.3;body.add(ch);}
  face={eyes,mouth};}
 return{car,body,wheels,hl,face};
}
const hero=makeCar('#ff2f2f');scene.add(hero.car);
const friends=[makeCar('#2f8bff'),makeCar('#ffc400'),makeCar('#2fd65a')];
friends.forEach(f=>{f.car.scale.setScalar(.75);scene.add(f.car);});
// blob shadows
function blob(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(0,0,0,.4)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,128,128);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(4,2.4),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.y=.02;return m;}
hero.car.add(blob());friends.forEach(f=>f.car.add(blob()));

// traffic light
const tl=new THREE.Group();scene.add(tl);
{const pole=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,4.2),std('#4a4e63',.5));pole.position.y=1.7;pole.scale.y=.82;tl.add(pole);
 const box=new THREE.Mesh(new RoundedBoxGeometry(.9,2.4,.8,4,.2),std('#2d3142',.4));box.position.y=4.1;tl.add(box);}
const lamps=['#ff2f2f','#ffc400','#2fd65a'].map((c,i)=>{const l=new THREE.Mesh(new THREE.SphereGeometry(.3,24,16),std(c,.3,{emissive:c,emissiveIntensity:0}));l.position.set(0,4.85-i*.75,.42);tl.add(l);return l;});

// confetti
const CN=240;const conf=new THREE.InstancedMesh(new THREE.PlaneGeometry(.22,.36),new THREE.MeshBasicMaterial({side:THREE.DoubleSide}),CN);
for(let i=0;i<CN;i++)conf.setColorAt(i,new THREE.Color(TC[i%TC.length]));scene.add(conf);const dummy=new THREE.Object3D();

// ---------- timeline ----------
const L=S.lines,intro=S.intro;
const lineAt=t=>L.findIndex(l=>t>=l.t0&&t<l.t1);
const envAt=t=>ENV[Math.min(ENV.length-1,Math.max(0,Math.floor(t*FPS)))]||0;
const bounce=t=>Math.abs(Math.sin(Math.PI*t/B));
const wordAt=(li,t)=>li<0?-1:L[li].words.findIndex(w=>t>=w.t0&&t<w.t1);
const tStop=L[3].words[0].t0,tGo=L[3].words[3].t0;   // "Stop" and "go" in the traffic line
// distance travelled: integrate speed (deterministic)
function speedAt(t){if(t<intro)return 4;const li=lineAt(t);
 if(li===3){if(t<tStop)return 5;if(t<tStop+.6)return lerp(5,0,eo(prog(t,tStop,tStop+.6)));if(t<tGo)return 0;return lerp(0,7,eo(prog(t,tGo,tGo+1)));}
 if(li===4)return 12;if(li===5)return lerp(9,4,prog(t,L[5].t0,L[5].t1));return 5;}
const distTab=[0];for(let i=1;i<=30*120;i++){distTab.push(distTab[i-1]+speedAt((i-.5)/120)/120);}
const distAt=t=>{const k=t*120,i=Math.floor(k),f=k-i;return lerp(distTab[Math.min(i,distTab.length-1)],distTab[Math.min(i+1,distTab.length-1)],f);};

const $=id=>document.getElementById(id);
$('title').innerHTML=[...'Beep Beep!'].map((ch,i)=>ch===' '?'&nbsp;':`<span style="color:${TC[i%TC.length]}">${ch}</span>`).join('');
const titleSpans=[...$('title').querySelectorAll('span')];
const WORDS={car:['CAR!','#ff3b3b'],wheels:['WHEELS!','#7b5bff'],lights:['LIGHTS!','#ffb000'],traffic:null,vroom:['VROOM!',null],bye:['BYE BYE!',null]};
let lastLine=-2;

window.renderAt=function(t){
 const li=lineAt(t),tag=li>=0?L[li].tag:'intro';
 const d=distAt(t),spd=speedAt(t);
 // scroll world
 dashes.position.x=-(d%2.4);
 deco.children.forEach(g=>{g.position.x=((g.userData.x0-d)%SPAN+SPAN*1.5)%SPAN-SPAN/2;});
 hills.position.x=-d*.05;
 clouds.forEach(c=>{c.position.x=((c.userData.x0-d*.15+t*.4)%96+144)%96-48;});
 // traffic light comes into view during line 3 and stops near the car
 if(li===3||(li===2&&t>L[2].t1-1.2)||(li===4&&t<L[4].t0+2)){const dStop=distAt(tStop+.6);tl.visible=true;tl.position.set(dStop-d+4.2,0,-2.6);}else tl.visible=false;
 const red=li===3&&t<tGo,green=li===3&&t>=tGo||li===4;
 const lit=[red,false,green],base=['#ff2f2f','#ffc400','#2fd65a'],dark=['#4a1a1a','#4a3d10','#143d1c'];lamps.forEach((l,k)=>{l.material.color.set(lit[k]?base[k]:dark[k]);l.material.emissiveIntensity=lit[k]?3:0;});

 // hero car
 const enter=t<intro?eo(prog(t,.3,2.6)):1;
 const hx=lerp(-14,0,enter);
 const bob=Math.abs(Math.sin(t*Math.PI/B))*.12*(spd>0?1:.3);
 hero.car.position.set(hx,bob,0);
 // squash when stopping, lean back when accelerating
 const brake=li===3?Math.sin(Math.PI*prog(t,tStop,tStop+.6)):0;const accel=li===3?Math.sin(Math.PI*prog(t,tGo,tGo+.8)):0;
 hero.body.rotation.z=-.12*brake+.1*accel+(li===4?.05:0);
 hero.car.rotation.y=-.62+Math.sin(t*1.3)*.06;
 hero.wheels.forEach(w=>w.rotation.z=-d/.5);
 const sing=li>=0,e=sing?envAt(t):0;
 hero.face.mouth.scale.y=.25+e*1.1;
 const bl=(t%3.3)<.12?.1:1;hero.face.eyes.forEach(x=>x.scale.y=bl);
 // headlights blink on "blink"
 const blinkOn=tag==='lights'&&wordAt(li,t)>=2&&wordAt(li,t)<=4&&((t-L[2].words[2].t0)%B)<B*.6;
 hero.hl.forEach(l=>l.material.emissiveIntensity=blinkOn?3.2:(tag==='lights'?.6:.2));
 // friends follow in the chorus and goodbye line
 friends.forEach((f,i)=>{const show=li>=4||t>S.duration-1;const p=show?eo(prog(t,L[4].t0+i*.35,L[4].t0+1.2+i*.35)):0;
  f.car.visible=p>0;f.car.position.set(lerp(-16,-3.0-i*2.4,p),Math.abs(Math.sin(t*Math.PI/B+i))*.1,(i%2?1.0:-1.0)*.9);
  f.car.rotation.y=-.62;f.wheels.forEach(w=>w.rotation.z=-d/.5);
  const fb=((t+i)%2.9)<.12?.1:1;f.face.eyes.forEach(x=>x.scale.y=fb);f.face.mouth.scale.y=.25+(li>=4?e:0)*1.0;});

 // camera
 let cz=11,cy=3.2,cx=2.2,lx=0;
 if(tag==='wheels'){const k=eo(prog(t,L[1].t0,L[1].t0+1));cz=lerp(11,7.5,k);cy=lerp(3.2,1.8,k);cx=lerp(2.2,1,k);}
 if(tag==='lights'){const k=eo(prog(t,L[2].t0,L[2].t0+1));cz=lerp(11,8,k);cx=lerp(2.2,5,k);lx=1.2*k;}
 if(tag==='traffic'){cz=12;cx=3;lx=1.5;}
 if(tag==='vroom'||tag==='bye'){const k=eo(prog(t,L[4].t0,L[4].t0+1.5));cz=lerp(11,14.5,k);lx=lerp(0,-3.4,k);cx=lerp(2.2,-1.6,k);cy=lerp(3.2,4,k);}
 cam.position.set(cx+Math.sin(t*.6)*.3,cy,cz);cam.lookAt(lx,1.2,0);
 // speed shake in chorus
 if(tag==='vroom'){cam.position.y+=Math.sin(t*40)*.03;}

 // confetti
 const confOn=tag==='vroom'||tag==='bye';
 for(let i=0;i<CN;i++){const age=t-L[4].t0;const fall=(age*(1.2+rnd(i+3)*1.2)+rnd(i+7)*14)%14;
  dummy.position.set(cam.position.x+(rnd(i+11)-.5)*12+lx,12-fall,(rnd(i+13)-.5)*6);dummy.rotation.set(t*3*rnd(i+1),t*4*rnd(i+2),t*2);
  dummy.scale.setScalar(confOn&&age>0?1:.0001);dummy.updateMatrix();conf.setMatrixAt(i,dummy.matrix);}
 conf.instanceMatrix.needsUpdate=true;
 renderer.render(scene,cam);

 // ---- overlays ----
 titleSpans.forEach((sp,i)=>{const a=.15+i*.08;const p=back(prog(t,a,a+.4));const out=1-eo(prog(t,intro-.45,intro-.05));
   sp.style.transform=`translateY(${lerp(-260,0,clamp(p,0,1.2))+Math.sin(t*6+i)*8}px) scale(${Math.max(.001,p)})`;sp.style.opacity=out;});
 // BEEP bubbles on the sung "beep"s (line 0 and last line) and a horn in the intro
 const bubbles=[[$('b1'),0,0],[$('b2'),0,1],[$('b1'),5,0],[$('b2'),5,1]];
 $('b1').style.opacity=0;$('b2').style.opacity=0;
 for(const [el,ln,wi] of bubbles){if(li===ln){const w=L[ln].words[wi];const p=prog(t,w.t0,w.t0+.25),o=1-prog(t,w.t1+.2,w.t1+.5);
   if(t>=w.t0&&o>0){el.style.opacity=o;el.style.transform=`scale(${back(p)}) rotate(${wi?8:-8}deg)`;}}}
 const w=$('word');
 if(li!==lastLine){lastLine=li;
  if(tag==='traffic')w.innerHTML='';
  else if(li>=0){const [txt,c]=WORDS[tag];w.innerHTML=c?`<span style="color:${c}">${txt}</span>`:[...txt].map((ch,i)=>ch===' '?' ':`<span style="color:${TC[i%TC.length]}">${ch}</span>`).join('');}
  else w.innerHTML='';
  const ly=$('lyr');ly.innerHTML=li>=0?L[li].words.map(x=>`<span>${x.w}</span>`).join(''):'';}
 if(tag==='traffic'){const s=t<tGo;const txt=s?'STOP!':'GO!';const c=s?'#ff3b3b':'#2fd65a';
   if(w.dataset.v!==txt){w.dataset.v=txt;w.innerHTML=`<span style="color:${c}">${txt}</span>`;}
   const p=back(prog(t,s?tStop:tGo,(s?tStop:tGo)+.35));w.style.opacity=t>=tStop?1:0;w.style.transform=`scale(${Math.max(.001,p)})`;}
 else if(li>=0){w.dataset.v='';const p=back(prog(t,L[li].t0,L[li].t0+.4));const out=li===L.length-1?1:1-eo(prog(t,L[li].t1-.25,L[li].t1));
   w.style.transform=`scale(${Math.max(.001,p*(1+.04*bounce(t)))}) rotate(${Math.sin(t*3)*2}deg)`;w.style.opacity=out;}
 else w.style.opacity=0;
 const ly=$('lyr');
 if(li>=0){const out=li===L.length-1?1:1-eo(prog(t,L[li].t1-.25,L[li].t1));ly.style.opacity=out;const wi=wordAt(li,t);
   [...ly.children].forEach((sp,k)=>{const on=k===wi,done=k<wi;
     let c=TC[(k+li)%TC.length];if(tag==='traffic')c=k<3?'#ff3b3b':'#2fd65a';if(tag==='car'&&k>=3)c='#ff3b3b';
     sp.style.color=on||done?c:'#3b3b55';sp.style.transform=on?'scale(1.14) translateY(-4px)':'none';});}
 else ly.style.opacity=0;
 $('flash').style.opacity=t>L[4].t0?Math.max(0,.6*(1-prog(t,L[4].t0,L[4].t0+.35))):0;
};
window.sceneReady=true;
</script></body></html>
