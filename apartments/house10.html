<style>

:root[data-theme="dark"]{--bg:#14171b;--panel:rgba(24,27,32,.86);--panel-solid:#1d2127;--fg:#eef0f2;--muted:#a6adb7;--line:rgba(238,240,242,.14);--accent:#d2ad7c;--accent-fg:#1d1408;--chip:#2a2f37;--sel:#6aa8f5;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui .card,.ui button{pointer-events:auto}
.card{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(10,15,20,.14)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.spec{padding:14px 16px;max-width:420px;min-width:0;display:grid;gap:10px}
.spec h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.1rem;letter-spacing:-.01em;text-wrap:balance}
.spec h1 span{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.legend{margin:0;font-size:.82rem;line-height:1.45;color:var(--muted)}

.tools{display:flex;flex-direction:column;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--fg);padding:0}
.icon-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.icon-btn svg{width:22px;height:22px}
.bottom{display:grid;gap:8px;justify-items:center}
.hint{font-size:.78rem;background:var(--panel);border:1px solid var(--line);padding:5px 12px;border-radius:999px;transition:opacity .6s;text-align:center;max-width:100%}
.picker{padding:10px 12px;display:grid;gap:8px;max-width:min(760px,100%);min-width:0}
.prow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.prow .lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-right:4px}
.pbtn{border:1px solid var(--line);background:var(--panel-solid);color:var(--fg);font:600 .82rem/1.1 var(--f-body);padding:7px 11px;border-radius:10px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.pbtn small{font-weight:500;color:var(--muted);margin-left:4px}
.pbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.pbtn[aria-pressed="true"] small{color:inherit;opacity:.85}
.pbtn.eye{background:var(--sel);color:#fff;border-color:transparent}
.modes{display:flex;padding:4px;gap:4px;max-width:100%}
.modes button{flex:1 1 auto;min-width:0;border:0;background:transparent;color:var(--fg);font:600 .9rem/1.1 var(--f-body);padding:10px 14px;border-radius:12px;cursor:pointer;white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.finish{display:flex;align-items:center;gap:8px;padding:6px 10px}
.finish .lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel-solid);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.dot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#tags{position:fixed;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-50%);background:var(--panel-solid);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:3px 8px 4px;font-size:.72rem;font-weight:700;white-space:nowrap;text-align:center;line-height:1.2;box-shadow:0 4px 12px rgba(0,0,0,.16)}

#loading{position:fixed;inset:0;display:grid;place-items:center;font-weight:600;color:var(--muted);pointer-events:none}

@media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>

  </div>
  <div class="bottom">

      <button id="m-f2" aria-pressed="false">2 этаж</button>
    </nav>
  </div>
</div>

   const za=Math.min(z(va),z(vb)),zb=Math.max(z(va),z(vb));wallRun(IG,'z',xw,apt.z0,apt.z1,y0,y0+H,.1,M.part,[[za,zb,y0,y0+2.1]]);}
  // furniture
  cols.forEach(c=>{const W=c.w,put=(u,v,w,dd,h,col,yy=0)=>box(IG,w,h,dd,c.xa+u,y0+yy+h/2,z(v),typeof col==='string'?F(col):col);
   const midLeft=cols.indexOf(c)>0&&cols[cols.indexOf(c)-1].t==='mid';
   if(c.t==='bed'){put(W/2,D-1.25,1.6,2.0,.4,'#e8e3d8');put(W/2,D-1.2,1.56,1.8,.12,'#a9bccb',.4);put(W/2,D-.22,1.7,.08,.9,'#7a6250');put(W/2-.4,D-.5,.55,.35,.12,'#ffffff',.48);put(W/2+.4,D-.5,.55,.35,.12,'#ffffff',.48);
    put(W/2-1.15,D-.45,.45,.4,.5,'#b89a78');put(W/2+1.15,D-.45,.45,.4,.5,'#b89a78');put(W/2+.4,.4,Math.min(2.0,W-1.2),.6,2.1,'#d8d0c4');}
   if(c.t==='kit'){const cu=midLeft?W-.33:.33;put(cu,1.7,.6,2.6,.9,'#f4f2ee');put(cu,1.7,.62,2.62,.04,'#3e3f42',.9);
    put(W/2,D*.45,1.2,.8,.75,'#9a7b5a');for(const [du,dv] of[[-.35,-.6],[.35,-.6],[-.35,.6],[.35,.6]])put(W/2+du,D*.45+dv,.42,.42,.45,'#6b7682');
    put(W/2,D-.55,2.0,.85,.45,'#6f8794');put(W/2,D-.18,2.0,.2,.8,'#5f7784');put(W/2,D-1.6,.9,.5,.38,'#b08a63');}
   if(c.t==='mid'){put(.3,c.hd/2,.55,Math.min(1.8,c.hd-1.2),2.1,'#d8d0c4');put(W-.3,c.hd-.6,.4,.8,.45,'#9a7b5a');
    put(W/2,D-.42,Math.min(1.7,W-.15),.72,.55,M.tile);put(.35,c.hd+.5,.42,.55,.42,'#ffffff');put(W-.32,c.hd+.4,.5,.45,.85,'#ffffff');put(W-.3,c.hd+.95,.55,.5,.85,'#e2e6ea');}});
 });
 // corridor walls with apartment entries and stair opening
 wallRun(IG,'x',1.5,-12.3,-2.6,y0,y0+H,.2,M.aptw,entriesF.filter(h=>h[0]<0));wallRun(IG,'x',1.5,2.6,12.3,y0,y0+H,.2,M.aptw,entriesF.filter(h=>h[0]>0));

 if(!lv){wallRun(IG,'x',6.5,-2.6,2.6,y0,y0+H,.1,M.part,[[-.7,.7,y0,y0+2.2]]);}
 // mailboxes / electrical board in lobby
 if(!lv){box(IG,1.2,.6,.25,-2.4,F1+1.3,5.3,F('#8f9399'));box(IG,.9,1.2,.25,2.42,F1+1.2,5.6,F('#b9bcc0'));}
}

const st=INT[0];const rise=H/20;
for(let k=0;k<10;k++){box(st,.26,rise*(k+1),1.2,1.3-(k+.5)*.26,F1+rise*(k+1)/2,3.55,M.stair);}
box(st,1.3,.2,2.6,-1.95,F1+H/2-.1,2.85,M.stair);
for(let k=0;k<10;k++){const top=F1+H/2+rise*(k+1);box(st,.26,.2+rise,1.2,-1.3+(k+.5)*.26,top-(.2+rise)/2,2.25,M.stair);}
const rl=box(st,2.7,.04,.04,0,F1+H/2+.9,2.9,M.rail);rl.rotation.z=Math.atan2(H/2,2.6)*0;for(let k=0;k<6;k++)box(st,.03,.9,.03,-1.3+k*.52,F1+.45+k*.3*(H/2)/1.56,2.92,M.rail);
L.forEach(g=>g.traverse(o=>{if(o.isMesh&&o.material&&!o.material.clippingPlanes){/* floors and slabs stay unclipped */}}));

// steel frame (shown in "Каркас")
const CX=[-12.38,-9.3,-6.2,-2.65,2.65,6.2,9.3,12.38],CZ=[ZB+.08,-3.5,-.1,1.5,4.4,ZF-.08];
const colAt=(x,z)=>box(STR,.16,TOP-F1+.2,.16,x,F1+(TOP-F1)/2,z,M.steel);
CX.forEach(x=>{colAt(x,ZF-.08);colAt(x,ZB+.08);});CZ.forEach(z=>{colAt(-12.38,z);colAt(12.38,z);});
[[-2.65,7.6],[2.65,7.6],[-2.65,1.5],[2.65,1.5]].forEach(([x,z])=>colAt(x,z));
for(const y of[F1+.05,F2-.08,TOP-.08]){box(STR,2*XO-.2,.16,.1,0,y,ZF-.08,M.steel);box(STR,2*XO-.2,.16,.1,0,y,ZB+.08,M.steel);
 box(STR,.1,.16,ZF-ZB-.2,-12.38,y,(ZF+ZB)/2,M.steel);box(STR,.1,.16,ZF-ZB-.2,12.38,y,(ZF+ZB)/2,M.steel);
 box(STR,2*XO-.3,.16,.1,0,y,1.5,M.steel);box(STR,2*XO-.3,.16,.1,0,y,-.1,M.steel);}
for(const [x,z0,z1] of[[-12.38,-3.5,-.1],[12.38,-3.5,-.1]])for(const [y0,y1] of[[F1,F2],[F2,TOP]]){const len=z1-z0,h=y1-y0,dd=Math.hypot(len,h);
 for(const sg of[1,-1]){const b=box(STR,.04,.06,dd,x,(y0+y1)/2,(z0+z1)/2,M.steel);b.rotation.x=sg*Math.atan2(h,len);}}
STR.visible=false;

// ---------- labels ----------
const tags=$('tags');
APTS.forEach(a=>{a.el=document.createElement('div');a.el.className='tag apt';a.el.innerHTML=`Кв. ${a.num}<i>${fmt(a.rooms.reduce((s,r)=>s+r.area,0))} м²</i>`;a.el.hidden=true;tags.appendChild(a.el);
 a.rooms.forEach(rm=>{rm.el=document.createElement('div');rm.el.className='tag';rm.el.innerHTML=`${rm.name}<i>${fmt(rm.area)} м²</i>`;rm.el.hidden=true;tags.appendChild(rm.el);});});

// ---------- camera + controls ----------
const ctl=new OrbitControls(cam,r.domElement);ctl.enableDamping=true;ctl.dampingFactor=.08;ctl.enablePan=false;ctl.minDistance=3;ctl.maxDistance=90;ctl.maxPolarAngle=1.48;
ctl.autoRotate=!reduce;ctl.autoRotateSpeed=.6;
const portrait=()=>innerWidth<innerHeight;
let tween=null;
function flyTo(pos,tgt,k=portrait()?1.8:1){const t=new THREE.Vector3(...tgt),p=new THREE.Vector3(...pos).sub(t).multiplyScalar(k).add(t);
 if(reduce){cam.position.copy(p);ctl.target.copy(t);return;}tween={t:0,st:performance.now(),p0:cam.position.clone(),p1:p,q0:ctl.target.clone(),q1:t};}
const VIEWS={facade:[[16,7,27],[0,3.4,0]],frame:[[-22,13,20],[0,3,0]],f1:[[4,24,16],[0,F1,0]],f2:[[4,27,16],[0,F2,0]]};
cam.position.set(...VIEWS.facade[0]);ctl.target.set(...VIEWS.facade[1]);if(portrait())cam.position.sub(ctl.target).multiplyScalar(1.8).add(ctl.target);

const LEG={facade:'<b>Фасад как на фото:</b> вертикальная доска под светлое дерево, графитовое обрамление и пояса, рейки в простенках, тёмный каменный цоколь, плоская кровля с карнизом.',
 frame:'<b>Конструктив:</b> стальные колонны по контуру, в углах и у подъезда, ригели на каждом перекрытии, связи жёсткости в торцах. Стены — SIP-панели 174 мм. Ленточный фундамент с ростверком.',
 f1:'<b>1 этаж — квартиры 1–5.</b> Выберите квартиру и комнату или нажмите на пол. Подъезд: тамбур, лестница 1,2 м.',
 f2:'<b>2 этаж — квартиры 6–10.</b> Выберите квартиру и комнату или нажмите на пол.'};
let mode='facade',selA=null,selR=null,eye=false,facade='photo';
const hl=new THREE.Color('#2f7de0');
function markRoom(rm,on){if(!rm)return;rm.mesh.material.emissive=on?hl:new THREE.Color(0);rm.mesh.material.emissiveIntensity=on?.35:0;}
function setLimits(){if(eye){ctl.minDistance=.01;ctl.maxDistance=1;ctl.minPolarAngle=.9;ctl.maxPolarAngle=2.2;ctl.enableZoom=false;ctl.rotateSpeed=-.35;}else{ctl.minDistance=3;ctl.maxDistance=90;ctl.minPolarAngle=0;ctl.maxPolarAngle=1.48;ctl.enableZoom=true;ctl.rotateSpeed=1;}
 cam.fov=eye?72:(innerWidth<innerHeight?56:38);cam.updateProjectionMatrix();}
function applyVis(){const lv=mode==='f1'?0:mode==='f2'?1:-1;
 L[1].visible=mode!=='f1';ROOF.visible=mode==='facade'||mode==='frame';WIN.visible=mode!=='frame';CLAD.visible=mode!=='frame';
 INT.forEach(g=>g.visible=mode!=='frame');STR.visible=FND.visible=mode==='frame';M.grass.opacity=mode==='frame'?.45:1;M.grass.depthWrite=mode!=='frame';
 if(mode==='frame'){M.ext.map=osbTex;M.ext.transparent=true;M.ext.opacity=.22;M.ext.depthWrite=false;M.inset.transparent=true;M.inset.opacity=.22;M.inset.depthWrite=false;}
 else{const ph=facade==='photo';M.ext.map=ph?woodBoardTex:marbleTex;M.ext.bumpMap=ph?woodBoardTex:marbleTex;M.ext.roughness=ph?.65:.32;M.inset.map=ph?slatTex:beigeTex;M.inset.bumpMap=ph?slatTex:null;M.core.map=ph?woodBoardTex:beigeTex;
  for(const k of['ext','inset','core']){M[k].transparent=false;M[k].opacity=1;M[k].depthWrite=true;}}
 if(mode==='frame')for(const k of['core']){M[k].transparent=true;M[k].opacity=.22;M[k].depthWrite=false;}
 GRID.visible=mode!=='frame'&&facade==='photo';M.ext.needsUpdate=M.inset.needsUpdate=M.core.needsUpdate=true;
 clip.constant=lv<0?1000:(lv?F2:F1)+(eye?2.95:1.5);}
function setMode(m){mode=m;['facade','frame','f1','f2'].forEach(k=>$('m-'+k).setAttribute('aria-pressed',k===m));
 markRoom(selR,false);selA=selR=null;eye=false;setLimits();applyVis();
 $('legend').innerHTML=LEG[m];$('finish').hidden=m!=='facade';$('picker').hidden=!(m==='f1'||m==='f2');renderPicker();flyTo(...VIEWS[m]);}
['facade','frame','f1','f2'].forEach(k=>$('m-'+k).onclick=()=>setMode(k));

function aptCenter(a){return[(a.x0+a.x1)/2,(a.z0+a.z1)/2];}
function selectApt(a){markRoom(selR,false);selA=a;selR=null;eye=false;setLimits();applyVis();const [cx,cz]=aptCenter(a),y=a.lv?F2:F1;
 flyTo([cx+2,y+11,cz+a.side.s*8],[cx,y,cz],portrait()?1.5:1);renderPicker();}
function selectRoom(rm){markRoom(selR,false);selA=rm.apt;selR=rm;markRoom(rm,true);eye=false;setLimits();applyVis();const cx=(rm.xa+rm.xb)/2,cz=(rm.za+rm.zb)/2;
 flyTo([cx+1,rm.y0+6.5,cz+rm.apt.side.s*4.5],[cx,rm.y0+.3,cz],portrait()?1.35:1);renderPicker();}
function enterEye(){if(!selR)return;eye=true;markRoom(selR,false);setLimits();applyVis();const rm=selR,cx=(rm.xa+rm.xb)/2,cz=(rm.za+rm.zb)/2;const s=rm.apt.side.s;
 const ze=s>0?rm.za+.45:rm.zb-.45,xe=rm.xa+.45,p=new THREE.Vector3(xe,rm.y0+1.6,ze),d=new THREE.Vector3(cx,rm.y0+1.35,cz).sub(p).normalize().multiplyScalar(.08);
 flyTo(p.toArray(),p.clone().add(d).toArray(),1);ctl.autoRotate=false;$('spin').setAttribute('aria-pressed',false);$('hint').textContent='Вы внутри комнаты: ведите пальцем, чтобы осмотреться';$('hint').style.opacity=1;renderPicker();}
function renderPicker(){const lv=mode==='f2'?1:0;
 $('aptRow').innerHTML='<span class="lbl">Квартира</span>'+APTS.filter(a=>a.lv===lv).map(a=>`<button class="pbtn" data-a="${a.num}" aria-pressed="${selA===a}">Кв. ${a.num}</button>`).join('');
 $('roomRow').hidden=!selA;if(selA)$('roomRow').innerHTML='<span class="lbl">Комнаты</span>'+selA.rooms.map((rm,i)=>`<button class="pbtn" data-r="${i}" aria-pressed="${selR===rm}">${rm.name}<small>${fmt(rm.area)} м²</small></button>`).join('')
  +(selR?(eye?'<button class="pbtn" id="eyeOut">Выйти из комнаты</button>':'<button class="pbtn eye" id="eyeIn">Войти внутрь</button>'):'');
 APTS.forEach(a=>{a.el.hidden=!(a.lv===lv&&(mode==='f1'||mode==='f2')&&!selA);a.rooms.forEach(rm=>rm.el.hidden=!(selA===a&&!eye));});}
$('picker').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a)selectApt(APTS.find(a=>a.num==b.dataset.a));
 else if(b.dataset.r!==undefined)selectRoom(selA.rooms[+b.dataset.r]);else if(b.id==='eyeIn')enterEye();else if(b.id==='eyeOut')selectRoom(selR);};

const FAC={photo:{name:'Как на фото: дерево и графит',ui:'#b08c68'},marble:{name:'Светлый мрамор',ui:'#eeedea'}};
$('facade').innerHTML=Object.entries(FAC).map(([k,v])=>`<button class="dot" data-k="${k}" aria-pressed="${k===facade}" title="${v.name}" aria-label="${v.name}" style="background:${v.ui}"></button>`).join('');
$('facade').onclick=e=>{const b=e.target.closest('button');if(!b)return;facade=b.dataset.k;$('facade').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));

const spin=$('spin');spin.setAttribute('aria-pressed',ctl.autoRotate);spin.onclick=()=>{ctl.autoRotate=!ctl.autoRotate;spin.setAttribute('aria-pressed',ctl.autoRotate);};

let hinted=false;ctl.addEventListener('start',()=>{tween=null;if(!hinted){hinted=true;$('hint').style.opacity=0;}});
// tap a room floor
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
r.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
r.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6||!(mode==='f1'||mode==='f2'))return;
 const b=r.domElement.getBoundingClientRect();ptr.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);ray.setFromCamera(ptr,cam);
 const lv=mode==='f2'?1:0;const hit=ray.intersectObjects(roomFloors.filter(m=>m.userData.room.apt.lv===lv),false)[0];if(hit)selectRoom(hit.object.userData.room);});

let comp=null;
if(composer&&innerWidth>700){try{const {EffectComposer,RenderPass,GTAOPass,OutputPass}=composer;comp=new EffectComposer(r);comp.addPass(new RenderPass(scene,cam));
 aoPass=new GTAOPass(scene,cam,innerWidth,innerHeight);aoPass.updateGtaoMaterial({radius:.9,distanceExponent:1.4,thickness:1.2,scale:1.1,samples:12});aoPass.blendIntensity=.9;comp.addPass(aoPass);comp.addPass(new OutputPass());}catch(e){comp=null;}}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;r.setSize(w,h,false);if(comp)comp.setSize(w,h);cam.aspect=w/h;cam.fov=eye?72:(w<h?56:38);cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const v=new THREE.Vector3();let last=performance.now();
function place(el,x,y,z,w,h){v.set(x,y,z).project(cam);el.style.left=(v.x*.5+.5)*w+'px';el.style.top=(-v.y*.5+.5)*h+'px';el.style.visibility=v.z<1?'visible':'hidden';}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(tween){tween.t=Math.min(1,(now-tween.st)/1100);const k=tween.t<.5?4*tween.t**3:1-Math.pow(-2*tween.t+2,3)/2;cam.position.lerpVectors(tween.p0,tween.p1,k);ctl.target.lerpVectors(tween.q0,tween.q1,k);if(tween.t>=1)tween=null;}
 ctl.update();if(comp&&mode==='facade')comp.render(dt);else r.render(scene,cam);
 if(mode==='f1'||mode==='f2'){const w=stage.clientWidth,h=stage.clientHeight;APTS.forEach(a=>{if(!a.el.hidden){const [cx,cz]=aptCenter(a);place(a.el,cx,(a.lv?F2:F1)+.1,cz,w,h);}
  a.rooms.forEach(rm=>{if(!rm.el.hidden)place(rm.el,(rm.xa+rm.xb)/2,rm.y0+.1,(rm.za+rm.zb)/2,w,h);});});}
 requestAnimationFrame(loop);}
setMode('facade');$('loading').hidden=true;requestAnimationFrame(loop);
