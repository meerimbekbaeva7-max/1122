<script>

const rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
for(let i=0;i<34;i++){const x=40+rnd(i)*1200,y=30+rnd(i+7)*660,r=2+rnd(i+3)*7;if(Math.abs(x-640)<230&&Math.abs(y-330)<230)continue;
 const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r}Z`);p.setAttribute('opacity',.4+rnd(i+11)*.6);sp.appendChild(p);}
document.fonts.ready.then(()=>{const img=document.querySelector('image');(img.complete===false?new Promise(r=>img.addEventListener('load',r)):Promise.resolve()).then(()=>window.ready=true);setTimeout(()=>window.ready=true,1500);});
</script></body></html>
