<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id);
const rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage=$('stage');
const r=new THREE.WebGLRenderer({antialias:true});
r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.0;
r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;stage.appendChild(r.domElement);
const scene=new THREE.Scene();const pm=new THREE.PMREMGenerator(r);const envTex=pm.fromScene(new RoomEnvironment(),.04).texture;scene.environment=envTex;

const sky=(a,b,c)=>ctex(2,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,a);gr.addColorStop(.6,b);gr.addColorStop(1,c);g.fillStyle=gr;g.fillRect(0,0,w,h);});
const SKY_DAY=sky('#4f95d6','#bcdcf3','#eef0ea'),SKY_EVE=sky('#1c2c52','#5d6f9c','#e9a978');
scene.background=SKY_DAY;scene.fog=new THREE.Fog('#dde8f0',60,220);
const sun=new THREE.DirectionalLight('#fff3df',3.0);sun.position.set(14,20,16);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:70});sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;scene.add(sun);
const hemi=new THREE.HemisphereLight('#d4e8ff','#7d8a62',.9);scene.add(hemi);

// ---------- textures ----------
const grassTex=ctex(512,512,(g,w,h)=>{g.fillStyle='#6c9f48';g.fillRect(0,0,w,h);for(let i=0;i<6000;i++){g.fillStyle=['#5f9640','#7cb352','#87bd5b','#558a38'][i%4];g.fillRect(rnd(i)*w,rnd(i+1)*h,2,3+rnd(i+2)*4);}},[40,40]);
const paveTex=ctex(512,512,(g,w,h)=>{g.fillStyle='#8d8f93';g.fillRect(0,0,w,h);for(let y=0;y<h;y+=64)for(let x=0;x<w;x+=128){const o=(y/64)%2?64:0;g.fillStyle=['#b9bbbe','#aeb0b4','#c3c4c6','#a7a9ad'][((x+y)/64|0)%4];g.fillRect(x+o+2,y+2,124,60);g.fillRect(x+o-126,y+2,124,60);}},[6,6]);
const woodTex=ctex(512,512,(g,w,h)=>{for(let x=0;x<w;x+=32){const k=x/32;g.fillStyle=['#a8703c','#9b6534','#b47b45','#93602f'][k%4];g.fillRect(x,0,32,h);
 for(let i=0;i<8;i++){g.strokeStyle='rgba(60,32,12,.25)';g.beginPath();const xx=x+3+rnd(k*17+i)*26;g.moveTo(xx,0);g.bezierCurveTo(xx+3,h*.3,xx-3,h*.6,xx+1,h);g.stroke();}g.fillStyle='rgba(30,15,5,.35)';g.fillRect(x+30,0,2,h);}},[1,1]);
const concTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#bdbab3';g.fillRect(0,0,w,h);for(let i=0;i<2500;i++){g.fillStyle=`rgba(${90+rnd(i)*80|0},${90+rnd(i)*80|0},${88+rnd(i)*70|0},.35)`;g.fillRect(rnd(i+1)*w,rnd(i+2)*h,1+rnd(i+3)*2,1+rnd(i+4)*2);}});
const gravTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#7c776d';g.fillRect(0,0,w,h);for(let i=0;i<500;i++){g.fillStyle=['#a49d90','#8c857a','#c2bcb1','#6d675d'][i%4];g.beginPath();g.ellipse(rnd(i)*w,rnd(i+1)*h,4+rnd(i+2)*9,3+rnd(i+3)*7,rnd(i+4)*3,0,7);g.fill();}});
const soilTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#8a6a48';g.fillRect(0,0,w,h);for(let i=0;i<3000;i++){g.fillStyle=['#7a5c3d','#9a7a55','#6b4f33'][i%3];g.fillRect(rnd(i)*w,rnd(i+1)*h,2,2);}},[4,1]);
const panelTex=ctex(512,512,(g,w,h)=>{g.fillStyle='#f1f2f0';g.fillRect(0,0,w,h);g.fillStyle='rgba(0,0,0,.08)';for(let y=0;y<h;y+=128)g.fillRect(0,y,w,3);for(let x=0;x<w;x+=256)g.fillRect(x,0,3,h);},[2,2]);

const std=(o)=>new THREE.MeshStandardMaterial(o);
const M={steel:std({color:'#3b4350',roughness:.45,metalness:.65}),beam:std({color:'#4a5463',roughness:.45,metalness:.6}),
 plate:std({color:'#5b6574',roughness:.4,metalness:.7}),bolt:std({color:'#b8bec6',roughness:.3,metalness:.9}),
 conc:std({map:concTex,roughness:.9,transparent:true}),grav:std({map:gravTex,roughness:1}),rebar:std({color:'#7a4b2a',roughness:.6,metalness:.5}),
 grass:std({map:grassTex,roughness:1,transparent:true}),pave:std({map:paveTex,roughness:.85}),soil:std({map:soilTex,roughness:1}),
 white:std({map:panelTex,roughness:.55}),dark:std({color:'#2f343b',roughness:.5,metalness:.2}),wood:std({map:woodTex,roughness:.6}),
 frame:std({color:'#23272d',roughness:.35,metalness:.4}),glass:new THREE.MeshPhysicalMaterial({color:'#9ec3dd',roughness:.04,opacity:.42,transparent:true,envMapIntensity:1.8}),
 rail:new THREE.MeshPhysicalMaterial({color:'#cfe6f3',roughness:.05,opacity:.28,transparent:true}),
 interior:std({color:'#e8dccb',roughness:.9,emissive:'#ffb866',emissiveIntensity:0}),
 lamp:std({color:'#fff5e0',emissive:'#ffd08a',emissiveIntensity:0}),deck:std({color:'#d9d4cb',roughness:.8}),
 brace:std({color:'#6b7584',roughness:.4,metalness:.6})};

// ---------- site ----------
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),M.grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const yard=new THREE.Mesh(new THREE.BoxGeometry(12,.04,9),M.pave);yard.position.set(0,.02,4.2);yard.receiveShadow=true;scene.add(yard);
const mts=new THREE.Group();scene.add(mts);
[[-70,-120,38,34],[-25,-140,46,40],[25,-130,40,36],[75,-125,44,38],[120,-100,34,30],[-120,-95,36,30]].forEach(([x,z,h,rr],i)=>{
 const m=new THREE.Mesh(new THREE.ConeGeometry(rr,h,7,1),std({color:'#6f7f95',roughness:1,flatShading:true}));m.position.set(x,h/2-2,z);m.rotation.y=i;mts.add(m);
 const cap=new THREE.Mesh(new THREE.ConeGeometry(rr*.38,h*.38,7,1),std({color:'#f4f7fb',roughness:.9,flatShading:true}));cap.position.set(x,h-2-h*.19+.2,z);cap.rotation.y=i;mts.add(cap);});
function fir(x,z,s){const g=new THREE.Group();const tr=new THREE.Mesh(new THREE.CylinderGeometry(.1,.14,1),std({color:'#5d4128'}));tr.position.y=.5;g.add(tr);
 for(let k=0;k<3;k++){const c=new THREE.Mesh(new THREE.ConeGeometry(1.1-k*.28,1.6,8),std({color:'#2f6b3a',roughness:.9,flatShading:true}));c.position.y=1.3+k*.8;c.castShadow=true;g.add(c);}
 g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);}
[[-7.5,-5,1.4],[-9,1,1.1],[8,-5.5,1.5],[9.5,.5,1.2],[-6,-9,1.6],[6,-10,1.3],[-12,-4,1.3],[12,-3,1.4]].forEach(a=>fir(...a));
const fence=new THREE.Mesh(new THREE.BoxGeometry(26,1.8,.15),std({color:'#e9e7e2',roughness:.8}));fence.position.set(0,.9,-8.5);fence.castShadow=fence.receiveShadow=true;scene.add(fence);

// ---------- structure: grid 3 × 2.5 m by 2 × 2.5 m, 12 columns ----------
const XS=[-3.75,-1.25,1.25,3.75],ZS=[-2.5,0,2.5],F1=.3,F2=3.0,ROOF=5.7;
const struct=new THREE.Group(),found=new THREE.Group(),env=new THREE.Group();scene.add(struct,found,env);
const pick=[];
function mk(geo,mat,parent,x,y,z,info){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;parent.add(m);if(info){m.userData.info=info;pick.push(m);}return m;}
const I={col:['Темир мамы','200×200×8 мм · 12 даана · бийиктиги 2,7 м × 2 кабат'],beamL:['Төмөнкү балка','Квадраттык труба 100×50×4 мм · ≈ 24 м'],
 beamU:['Жогорку балка','Квадраттык труба 100×50×4 мм · ≈ 24 м'],plate:['База плитасы','250×250×10 мм · ар бир мамыда'],
 bolt:['Анкер-болт M16','Ар бир мамыга 4 даана · жалпы 48 даана'],foot:['Бетон таман','800×800×500 мм · бетон B25 (M350) · ≈ 6,0 м³'],
 grav:['Чопмо таш катмары','100 мм · таман астында'],rebar:['Арматура','Ø12 AIII (12 даана) + Ø8 AI, кадам 200 мм'],brace:['Байланыш (крест)','Каркастын бекемдиги үчүн'],
 wall:['Сырткы дубал','Фасаддык панелдер · жылуулоо ичинде'],glass:['Панорамалык терезе','Эки кабаттуу айнек пакет · кара алюминий рама'],
 roof:['Жалпак чатыр','Чыгып турган карниз · LED жарыктар'],balcony:['Балкон','Айнек тосмо · 2-кабат'],wood:['Жыгач панель','Фасаддагы жыгач декор']};
// footings
const fGroup=[];
XS.forEach(x=>ZS.forEach(z=>{
 const g=new THREE.Group();g.position.set(x,0,z);found.add(g);fGroup.push(g);
 mk(new THREE.BoxGeometry(.8,.5,.8),M.conc,g,0,-.2,0,I.foot);
 mk(new THREE.BoxGeometry(.8,.1,.8),M.grav,g,0,-.5,0,I.grav);
 const cage=new THREE.Group();g.add(cage);cage.visible=false;cage.userData.cage=true;
 for(const k of[-.3,-.1,.1,.3]){mk(new THREE.CylinderGeometry(.008,.008,.72),M.rebar,cage,k,-.37,0,I.rebar).rotation.x=Math.PI/2;mk(new THREE.CylinderGeometry(.008,.008,.72),M.rebar,cage,0,-.37,k,I.rebar).rotation.z=Math.PI/2;}
 for(const sx of[-.3,.3])for(const sz of[-.3,.3])mk(new THREE.CylinderGeometry(.006,.006,.42),M.rebar,cage,sx,-.2,sz,I.rebar);
 mk(new THREE.BoxGeometry(.25,.01,.25),M.plate,g,0,.055,0,I.plate);
 for(const sx of[-.09,.09])for(const sz of[-.09,.09]){mk(new THREE.CylinderGeometry(.008,.008,.12),M.bolt,g,sx,.08,sz,I.bolt);mk(new THREE.CylinderGeometry(.016,.016,.02,6),M.bolt,g,sx,.07,sz,I.bolt);}
}));
// columns
XS.forEach(x=>ZS.forEach(z=>mk(new THREE.BoxGeometry(.2,ROOF-.06,.2),M.steel,struct,x,.06+(ROOF-.06)/2,z,I.col)));
// beams at three levels (100 x 50 tubes)
function beam(x1,z1,x2,z2,y,info){const len=Math.hypot(x2-x1,z2-z1);const m=mk(new THREE.BoxGeometry(len,.1,.05),M.beam,struct,(x1+x2)/2,y,(z1+z2)/2,info);m.rotation.y=-Math.atan2(z2-z1,x2-x1);return m;}
[F1-.05,F2-.05,ROOF-.05].forEach((y,li)=>{const info=li?I.beamU:I.beamL;
 ZS.forEach(z=>beam(XS[0],z,XS[3],z,y,info));XS.forEach(x=>beam(x,ZS[0],x,ZS[2],y,info));});
// X-bracing on middle bays (back, left, right walls), both floors
function brace(a,b,y0,y1){const dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz),h=y1-y0,d=Math.hypot(len,h);
 for(const s of[1,-1]){const m=mk(new THREE.BoxGeometry(d,.05,.012),M.brace,struct,(a[0]+b[0])/2,(y0+y1)/2,(a[1]+b[1])/2,I.brace);m.rotation.order='YXZ';m.rotation.y=-Math.atan2(dz,dx);m.rotation.z=s*Math.atan2(h,len);}}
for(const [y0,y1] of[[F1,F2-.1],[F2,ROOF-.1]]){brace([-1.25,-2.5],[1.25,-2.5],y0,y1);brace([-3.75,-2.5],[-3.75,0],y0,y1);brace([3.75,0],[3.75,2.5],y0,y1);}

// ---------- envelope (finished house) ----------
const TH=.14;
// face: n = outward normal axis; u runs along wall
const FACES={front:{len:7.5,place:(u,o)=>[u,2.5+o],ry:0},back:{len:7.5,place:(u,o)=>[-u,-2.5-o],ry:Math.PI},

 for(let i=0;i<xs.length-1;i++){const a=xs[i],b=xs[i+1];if(b-a<1e-3)continue;const mid=(a+b)/2;
  const cut=holes.filter(o=>o[0]<=mid&&o[1]>=mid&&o[3]>y0&&o[2]<y1).sort((p,q)=>p[2]-q[2]);let y=y0;

 bars.forEach(([a,b,c,d])=>rect(face,a,b,c,d,M.frame,.17,.18,I.glass));

for(let k=0;k<5;k++)lamps.push(mk(new THREE.CylinderGeometry(.06,.06,.02,12),M.lamp,env,4.15,ROOF-.06,-2.2+k*1.1,I.roof));

mk(new THREE.BoxGeometry(.02,1.0,1.25),M.rail,env,1.24,F2+.58,3.35,I.balcony);mk(new THREE.BoxGeometry(4.62,.04,.05),M.frame,env,-1.05,F2+1.09,3.98,I.balcony);
const balLamps=[0,1,2].map(k=>{const l=mk(new THREE.CylinderGeometry(.05,.05,.02,12),M.lamp,env,-2.6+k*1.55,F2-.12,3.4,I.balcony);lamps.push(l);return l;});
// steps + planters + wall sconces
for(let k=0;k<3;k++)mk(new THREE.BoxGeometry(1.8,.1,.35),M.dark,env,2.45,.05+k*.1,3.35-k*.3,['Тепкич','Кире бериш']);
for(const x of[1.2,3.7]){mk(new THREE.BoxGeometry(.4,.8,.4),std({color:'#e7e5df',roughness:.7}),env,x,.4,3.4,null);const c=mk(new THREE.ConeGeometry(.28,1.1,8),std({color:'#2f6b3a',flatShading:true}),env,x,1.35,3.4,null);}
const sconces=[[-3.4,2.0],[1.45,2.0],[3.55,1.9]].map(([x,y])=>{const s=mk(new THREE.BoxGeometry(.1,.3,.08),M.lamp,env,x,y,2.95,null);lamps.push(s);return s;});
const glow=[];[[-1.05,F2-.35,3.4],[2.45,1.9,3.3],[0,ROOF-.5,3.3]].forEach(p=>{const l=new THREE.PointLight('#ffc57a',0,8,1.6);l.position.set(...p);scene.add(l);glow.push(l);});

 const pts=[A,B,A.clone().add(T),A.clone().sub(T),B.clone().add(T),B.clone().sub(T)];

 DIMS.push({p:A.clone().add(B).multiplyScalar(.5),label});}

[0,1,2].forEach(k=>dim([XS[k],.02,3.1],[XS[k+1],.02,3.1],'2,50 м',[0,0,.1]));

// ---------- controls ----------
const ctl=new OrbitControls(cam,r.domElement);ctl.enableDamping=true;ctl.dampingFactor=.08;ctl.minDistance=4;ctl.maxDistance=60;ctl.enablePan=false;

const LEG={house:'<b>Заманбап 2 кабаттуу коттедж:</b> панорамалык терезелер, айнек тосмолуу балкон, жалпак чатыр жана жыгач декор.',
 frame:'<b>Темир каркас:</b> мамы 200×200×8 мм — 12 даана, балка 100×50×4 мм, кабаттын бийиктиги 2,7 м, крест байланыштар.',
 found:'<b>Пайдубал:</b> бетон таман 800×800×500 мм (B25), астында чопмо таш 100 мм, анкер-болт M16 × 4, база плитасы 250×250×10 мм.'};
let mode='house';
function setMode(m){mode=m;['house','frame','found'].forEach(k=>$('m-'+k).setAttribute('aria-pressed',k===m));
 env.visible=m==='house';struct.visible=m!=='found';dimG.visible=m!=='house';soil.visible=m==='found';
 M.grass.opacity=m==='found'?.0:1;ground.visible=m!=='found';yard.visible=m!=='found';

 sun.intensity=n?.25:3.0;sun.color.set(n?'#ffb47a':'#fff3df');sun.position.set(n?-18:14,n?6:20,n?10:16);hemi.intensity=n?.22:.9;scene.environment=envTex;r.toneMappingExposure=n?1.15:1.0;
 M.interior.emissiveIntensity=n?2.6:0;M.lamp.emissiveIntensity=n?3:0;glow.forEach(l=>l.intensity=n?6:0);}
