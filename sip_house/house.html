[1,-1].forEach(side=>{const sh=new THREE.Shape();sh.moveTo(-Wd/2,0);sh.lineTo(Wd/2,0);sh.lineTo(0,2.2);sh.lineTo(-Wd/2,0);

 const fr=new THREE.Mesh(new THREE.BoxGeometry(o.w-.02,h,T+.06),M.frame.clone());const inner=new THREE.Mesh(new THREE.BoxGeometry(o.w-.16,h-.14,T+.08),M.frame);

{const w=2.4,h=1.6;const o=.06,f=.5;const mk=(mat,d)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.castShadow=m.receiveShadow=true;det.add(m);return m;};

const $=id=>document.getElementById(id);

 if(MODE==='detail'){house.visible=false;det.visible=true;TREES.forEach(t=>t.visible=false);walk.visible=false;const k=eio(prog(t,0,1.5));const {a,b,c}=det.userData;a.position.z=lerp(.28,.75,k);b.position.z=lerp(-.28,-.75,k);c.position.z=0;
