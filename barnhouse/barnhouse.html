<title>Барнхаус 90 м²</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: full-bleed 3D stage; spec card top-left, tools top-right; room picker + floor switch docked at the bottom */
:root{
  --bg:#e6e8e9;--panel:rgba(255,255,255,.88);--panel-solid:#ffffff;--fg:#1e2228;--muted:#5e6670;--line:rgba(30,34,40,.12);
  --accent:#b06a1f;--accent-fg:#ffffff;--chip:#f3ece3;--sel:#2f7de0;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161a;--panel:rgba(23,26,31,.86);--panel-solid:#1c2026;--fg:#eef0f2;--muted:#a6adb7;--line:rgba(238,240,242,.14);--accent:#f0a95a;--accent-fg:#241303;--chip:#2b2f36;--sel:#6aa8f5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13161a;--panel:rgba(23,26,31,.86);--panel-solid:#1c2026;--fg:#eef0f2;--muted:#a6adb7;--line:rgba(238,240,242,.14);--accent:#f0a95a;--accent-fg:#241303;--chip:#2b2f36;--sel:#6aa8f5;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui .card,.ui button{pointer-events:auto}
.card{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(10,15,20,.14)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.spec{padding:14px 16px;max-width:420px;min-width:0;display:grid;gap:10px}
.spec h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.1rem;letter-spacing:-.01em;text-wrap:balance}
.spec h1 span{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{margin:0;font-size:.82rem;line-height:1.45;color:var(--muted)}
.legend b{color:var(--fg);font-weight:600}
.tools{display:flex;flex-direction:column;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--fg);padding:0}
.icon-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.icon-btn svg{width:22px;height:22px}
.bottom{display:grid;gap:8px;justify-items:center}
.hint{font-size:.78rem;background:var(--panel);border:1px solid var(--line);padding:5px 12px;border-radius:999px;transition:opacity .6s;text-align:center;max-width:100%}
.picker{padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(820px,100%);min-width:0;align-items:center}
.picker .lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-right:4px}
.pbtn{border:1px solid var(--line);background:var(--panel-solid);color:var(--fg);font:600 .8rem/1.1 var(--f-body);padding:7px 10px;border-radius:10px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.pbtn small{font-weight:500;color:var(--muted);margin-left:4px}
.pbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.pbtn[aria-pressed="true"] small{color:inherit;opacity:.85}
.pbtn.eye{background:var(--sel);color:#fff;border-color:transparent}
.modes{display:flex;padding:4px;gap:4px;max-width:100%}
.modes button{flex:1 1 auto;min-width:0;border:0;background:transparent;color:var(--fg);font:600 .9rem/1.1 var(--f-body);padding:10px 16px;border-radius:12px;cursor:pointer;white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.finish{display:flex;align-items:center;gap:8px;padding:6px 10px}
.finish .lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel-solid);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.dot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#tags{position:fixed;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-50%);background:var(--panel-solid);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:3px 8px 4px;font-size:.72rem;font-weight:700;white-space:nowrap;text-align:center;line-height:1.2;box-shadow:0 4px 12px rgba(0,0,0,.16)}
.tag i{display:block;font-style:normal;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-weight:600;color:var(--muted);pointer-events:none}

@media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>

    </div>
  </div>
  <div class="bottom">
    <div class="hint" id="hint">Крутите дом пальцем или мышкой · щипок или колесо — приблизить</div>
    <div class="card finish" id="finish"><span class="lbl">Дерево</span><span id="wood" style="display:flex;gap:6px"></span></div>
    <div class="card picker" id="picker" hidden></div>
    <nav class="card modes" aria-label="Режим">
      <button id="m-facade" aria-pressed="true">Фасад</button>
      <button id="m-f1" aria-pressed="false">1 этаж</button>
      <button id="m-f2" aria-pressed="false">2 этаж</button>
    </nav>
  </div>
</div>

// ---------- front deck on concrete blocks ----------
box(bld,2*XO+.8,.06,2.1,0,.43,ZO+1.05,M.deck);for(const x of[-XO-.25,-1.2,1.2,XO+.25])for(const z of[ZO+.25,ZO+1.9])box(bld,.36,.4,.36,x,.2,z,M.conc);
box(bld,2*XO+.8,.16,.06,0,.32,ZO+2.1,F('#5a3a22'));for(let k=0;k<2;k++)box(bld,1.8,.14,.3,-.2,.07+k*.14,ZO+2.4-k*.3,M.conc);
box(bld,.5,.9,.3,XO-.4,.9,ZO+.45,F('#b98a5a'));for(let k=0;k<3;k++)box(bld,.5,.02,.3,XO-.4,.55+k*.3,ZO+.45,F('#a0764c'));

// ---------- labels ----------
ROOMS.forEach(rm=>{rm.el=document.createElement('div');rm.el.className='tag';rm.el.innerHTML=`${rm.name}<i>${fmt(rm.area)} м²</i>`;rm.el.hidden=true;$('tags').appendChild(rm.el);});
const total=ROOMS.reduce((s,r)=>s+r.area,0);

// ---------- camera, modes ----------
const ctl=new OrbitControls(cam,r.domElement);ctl.enableDamping=true;ctl.dampingFactor=.08;ctl.enablePan=false;ctl.minDistance=3;ctl.maxDistance=80;ctl.maxPolarAngle=1.48;
ctl.autoRotate=!reduce;ctl.autoRotateSpeed=.6;
const portrait=()=>innerWidth<innerHeight;
let tween=null;
function flyTo(pos,tgt,k=portrait()?1.8:1){const t=new THREE.Vector3(...tgt),p=new THREE.Vector3(...pos).sub(t).multiplyScalar(k).add(t);
 if(reduce){cam.position.copy(p);ctl.target.copy(t);return;}tween={st:performance.now(),p0:cam.position.clone(),p1:p,q0:ctl.target.clone(),q1:t};}
const VIEWS={facade:[[8,4.6,20],[0,4.0,0]],f1:[[2,11,8],[0,FL,0]],f2:[[2,14,8],[0,F2,0]]};
cam.position.set(...VIEWS.facade[0]);ctl.target.set(...VIEWS.facade[1]);if(portrait())cam.position.sub(ctl.target).multiplyScalar(1.8).add(ctl.target);
const LEG={facade:`<b>Барнхаус как на фото:</b> фасад из медовой сосны, крутая двускатная крыша 50° из графитового металла, огромные окна в пол, на втором этаже — окна по форме крыши, подшивка свеса с гирляндой и терраса на всю ширину. Нажмите луну — вечерний вид.`,
 f1:'<b>1 этаж ≈ 46 м²:</b> кухня-гостиная с лестницей на второй этаж и выходом на террасу, спальня, санузел с душем, котельная. Выберите комнату или нажмите на пол.',
 f2:'<b>2 этаж ≈ 41 м²:</b> три спальни под высоким потолком по скату крыши, санузел и холл с ограждением у лестницы.'};
let mode='facade',selR=null,eye=false;
const hl=new THREE.Color('#2f7de0');
function mark(rm,on){if(!rm)return;rm.meshes.forEach(m=>{m.material.emissive=on?hl:new THREE.Color(0);m.material.emissiveIntensity=on?.3:0;});}
function setLimits(){if(eye){ctl.minDistance=.01;ctl.maxDistance=1;ctl.minPolarAngle=.9;ctl.maxPolarAngle=2.2;ctl.enableZoom=false;ctl.rotateSpeed=-.35;}
 else{ctl.minDistance=3;ctl.maxDistance=80;ctl.minPolarAngle=0;ctl.maxPolarAngle=1.48;ctl.enableZoom=true;ctl.rotateSpeed=1;}cam.fov=eye?72:(portrait()?56:38);cam.updateProjectionMatrix();}
function applyVis(){const show2=mode!=='f1'||eye;L2.visible=show2;ROOF.visible=mode==='facade'||eye;
 clip.constant=eye?1000:mode==='f1'?FL+1.5:mode==='f2'?F2+1.5:1000;}
function setMode(m){mode=m;['facade','f1','f2'].forEach(k=>$('m-'+k).setAttribute('aria-pressed',k===m));mark(selR,false);selR=null;eye=false;setLimits();applyVis();
 $('legend').innerHTML=LEG[m];$('finish').hidden=m!=='facade';$('picker').hidden=m==='facade';renderPicker();flyTo(...VIEWS[m]);}
['facade','f1','f2'].forEach(k=>$('m-'+k).onclick=()=>setMode(k));
function selectRoom(rm){mark(selR,false);selR=rm;mark(rm,true);eye=false;setLimits();applyVis();const cx=(rm.xa+rm.xb)/2,cz=(rm.za+rm.zb)/2;
 flyTo([cx+1,rm.y0+6,cz+4],[cx,rm.y0+.3,cz],portrait()?1.35:1);renderPicker();}
function enterEye(){if(!selR)return;const rm=selR;eye=true;mark(rm,false);setLimits();applyVis();const cx=(rm.xa+rm.xb)/2,cz=(rm.za+rm.zb)/2;
 const corners=[[rm.xa+.45,rm.za+.45],[rm.xb-.45,rm.za+.45],[rm.xa+.45,rm.zb-.45],[rm.xb-.45,rm.zb-.45]].sort((a,b)=>Math.hypot(a[0],a[1])-Math.hypot(b[0],b[1]));
 const p=new THREE.Vector3(corners[0][0],rm.y0+1.6,corners[0][1]),d=new THREE.Vector3(cx,rm.y0+1.45,cz).sub(p).normalize().multiplyScalar(.08);
 flyTo(p.toArray(),p.clone().add(d).toArray(),1);ctl.autoRotate=false;$('spin').setAttribute('aria-pressed',false);$('hint').textContent='Вы внутри комнаты: ведите пальцем, чтобы осмотреться';$('hint').style.opacity=1;renderPicker();}
function renderPicker(){const lv=mode==='f2'?1:0;const list=ROOMS.filter(r=>r.lv===lv);
 $('picker').innerHTML='<span class="lbl">Комнаты</span>'+list.map(rm=>`<button class="pbtn" data-r="${ROOMS.indexOf(rm)}" aria-pressed="${selR===rm}">${rm.name}<small>${fmt(rm.area)} м²</small></button>`).join('')
 +(selR?(eye?'<button class="pbtn" id="eyeOut">Выйти из комнаты</button>':'<button class="pbtn eye" id="eyeIn">Войти внутрь</button>'):'');
 ROOMS.forEach(rm=>rm.el.hidden=!(mode!=='facade'&&!eye&&rm.lv===lv));}
$('picker').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.r!==undefined)selectRoom(ROOMS[+b.dataset.r]);else if(b.id==='eyeIn')enterEye();else if(b.id==='eyeOut')selectRoom(selR);};
$('wood').innerHTML=Object.entries(WOODS).map(([k,v])=>`<button class="dot" data-k="${k}" aria-pressed="${k==='honey'}" title="${v.name}" aria-label="${v.name}" style="background:${v.ui}"></button>`).join('');
$('wood').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('wood').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));const t=WOODS[b.dataset.k].tex;M.wood.map=t;M.wood.bumpMap=t;M.wood.needsUpdate=true;};
let night=false;
$('night').onclick=()=>{night=!night;$('night').setAttribute('aria-pressed',night);dome.material.map=night?skyEve:skyDay;dome.material.needsUpdate=true;scene.fog.color.set(night?'#262a38':'#e6e9e8');
 sun.intensity=night?.12:2.5;hemi.intensity=night?.1:1.15;scene.environment=night?envNight:envDay;r.toneMappingExposure=night?1.3:1.05;
 M.bulb.emissiveIntensity=night?6:.5;M.lamp.emissiveIntensity=night?4:.4;M.curtain.emissiveIntensity=night?1.1:0;roomLights.forEach(l=>l.intensity=night?6:0);facadeGlow.forEach(l=>l.intensity=night?7:0);};
const spin=$('spin');spin.setAttribute('aria-pressed',ctl.autoRotate);spin.onclick=()=>{ctl.autoRotate=!ctl.autoRotate;spin.setAttribute('aria-pressed',ctl.autoRotate);};
$('reset').onclick=()=>setMode(mode);
let hinted=false;ctl.addEventListener('start',()=>{tween=null;if(!hinted){hinted=true;$('hint').style.opacity=0;}});
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
r.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
r.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6||mode==='facade'||eye)return;
 const b=r.domElement.getBoundingClientRect();ptr.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);ray.setFromCamera(ptr,cam);const lv=mode==='f2'?1:0;
 const hit=ray.intersectObjects(floors.filter(m=>m.userData.room.lv===lv),false)[0];if(hit)selectRoom(hit.object.userData.room);});

let comp=null;
if(composer&&innerWidth>700){try{const {EffectComposer,RenderPass,GTAOPass,OutputPass}=composer;comp=new EffectComposer(r);comp.addPass(new RenderPass(scene,cam));
 const ao=new GTAOPass(scene,cam,innerWidth,innerHeight);ao.updateGtaoMaterial({radius:.7,distanceExponent:1.4,thickness:1.2,scale:1.1,samples:12});ao.blendIntensity=.8;comp.addPass(ao);comp.addPass(new OutputPass());}catch(e){comp=null;}}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;r.setSize(w,h,false);if(comp)comp.setSize(w,h);cam.aspect=w/h;cam.fov=eye?72:(w<h?56:38);cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const v=new THREE.Vector3();let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(tween){const t=Math.min(1,(now-tween.st)/1100),k=t<.5?4*t**3:1-Math.pow(-2*t+2,3)/2;cam.position.lerpVectors(tween.p0,tween.p1,k);ctl.target.lerpVectors(tween.q0,tween.q1,k);if(t>=1)tween=null;}
 ctl.update();if(comp&&mode==='facade'&&!night)comp.render(dt);else r.render(scene,cam);
 if(mode!=='facade'&&!eye){const w=stage.clientWidth,h=stage.clientHeight;ROOMS.forEach(rm=>{if(rm.el.hidden)return;v.set((rm.xa+rm.xb)/2,rm.y0+.1,(rm.za+rm.zb)/2).project(cam);rm.el.style.left=(v.x*.5+.5)*w+'px';rm.el.style.top=(-v.y*.5+.5)*h+'px';rm.el.style.visibility=v.z<1?'visible':'hidden';});}
 requestAnimationFrame(loop);}
setMode('facade');$('loading').hidden=true;requestAnimationFrame(loop);
</script>
